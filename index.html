  '잘함_제안':'「{문장}」처럼 구체적으로 제안했어요.',
  '잘함_근거':'「{문장}」처럼 분석 결과를 근거로 썼어요.',
  '되묻기':'한 번 더 확인: 앞 문장이 정말 뒤 문장의 이유가 되는지 소리 내어 읽어 보자.',
  '반복연결어':'\'{단어}\'를 여러 번 썼어요. 다른 이어 주는 말도 써 보자.',
  '맞춤법':'맞춤법 한번 볼까요? (판정과는 상관없어요)',
  '미완결':'「{문장}」은 끝맺지 못한 문장이에요. \'~다\', \'~이다\'처럼 끝까지 써서 문장을 마무리해 보자.',
  '연결_되풀이':'「{문장}」은 처음에 말한 것을 결론에서 다시 말하고 있어요(순환). 결론에는 앞 문장들로 알게 된 두 자료 사이의 관계를 한 번만 써 보자.',
  '인과_확인':'「{문장}」 이 문장을 다시 읽어 보며 무엇이 원인이고 무엇이 결과인지 맞게 썼는지 확인해 보자.',
  '문체':'「{앞}」은 \'~다\'로, 「{뒤}」는 \'~요/~니다\'로 끝나요. 한 글 안에서는 \'~다\'체로 맞춰 써 보자.'};
const ESLAB={target:'① 대상 밝히기',trend:'② 관찰한 경향',concl:'③ 실제 이름으로 쓴 결론',link:'④ 근거와 주장 잇기',sugg:'① 구체적인 제안',data:'② 데이터 근거',linkP:'③ 근거와 제안 잇기'};
const ESCODE={'5마디':'B','연결_나열':'G','연결_그리고':'G','연결_순환':'E','연결_되풀이':'D'}; // 고칠 점 → 논리적 오류 모음 유형(A~I). 짝이 있으면 피드백 아래에서 그 유형을 바로 펼쳐 볼 수 있어요
function esFeedback(o,ph,task){
  const P=Object.assign({},ESPH,ph||{}),cut=s=>{s=String(s||'');return s.length>70?s.slice(0,68)+'…':s},
    f=(id,v)=>String(P[id]||'').replace(/\{앞\}/g,cut(v&&v.a)).replace(/\{뒤\}/g,cut(v&&v.b)).replace(/\{문장\}/g,cut(v&&v.s)).replace(/\{단어\}/g,(v&&v.w)||'').replace(/\{X\}/g,(task&&task.x)||'X').replace(/\{Y\}/g,(task&&task.y)||'Y');
  const r={head:P['안내'],els:[],fix:[],fixT:[],good:'',tips:[],all:o.all};
  if(o.all==='판정안함'){r.msg=f(o.short?'판정_짧음':'판정안함');return r}
  if(o.over){r.msg=f('전체_다시');r.fix.push(f('5마디',{s:o.over}));r.fixT.push(ESCODE['5마디']);return r}
  r.msg=f({통과:'전체_통과',조금:'전체_조금',다시:'전체_다시'}[o.all]);
  Object.keys(o.el).forEach(k=>r.els.push([o.kind==='제안'&&k==='link'?ESLAB.linkP:ESLAB[k],o.el[k]]));
  const E=o.el,F=[],FT=[],add=(id,v)=>{F.push(f(id,v));FT.push(ESCODE[id]||'')};
  if(o.wrong)add('방향_반대',{s:o.wrong});
  if(o.loop)add('연결_되풀이',{s:o.loop});
  if(E.link==='나열'&&o.addOnly)add('연결_그리고',{s:o.addOnly});
  else if(E.link==='나열'&&o.gap)add('연결_나열',{a:o.gap[0],b:o.gap[1]});
  else if(E.link==='근거없음')add('연결_순환',{s:o.circ});
  if(o.kind==='해석'){
    if(E.trend==='라벨만')add('경향_라벨',{s:o.quote.trend});else if(E.trend==='없음')add('경향_없음');
    if(E.concl!=='충족')add('결론_없음');
    if(E.target!=='충족')add('대상_없음');
    r.good=E.trend==='충족'&&o.quote.trend!==o.wrong?f('잘함_경향',{s:o.quote.trend}):E.link==='충족'?f('잘함_연결'):E.target==='충족'?f('잘함_대상'):E.concl==='충족'?f('잘함_결론'):'';
  }else{
    if(E.data!=='충족')add('근거_없음');
    if(E.sugg==='부족')add('제안_부족');else if(E.sugg==='없음')add('제안_없음');
    r.good=E.sugg==='충족'?f('잘함_제안',{s:o.quote.sugg}):E.data==='충족'?f('잘함_근거',{s:o.quote.data}):E.link==='충족'?f('잘함_연결'):'';
  }
  r.fix=F.slice(0,2);r.fixT=FT.slice(0,2);
  if(o.rev){r.fix.push(f('인과_확인',{s:o.rev}));r.fixT.push('')} // 단정하지 않고 되묻기 (판정에는 안 들어감)
  if(o.cut){r.fix.push(f('미완결',{s:o.cut}));r.fixT.push('C')}
  if(o.mix){r.fix.push(f('문체',{a:o.mix[0],b:o.mix[1]}));r.fixT.push('H')}
  o.tips.forEach(t=>r.tips.push(f(t.id,t)));
  r.check=o.all==='통과'?String(P['자기점검']||'').split('|').map(x=>x.trim()).filter(Boolean):[]; // 통과해도 스스로 한 번 더 볼 것
  return r}

/* 논리적 오류 모음: 수행평가 글에서 뽑은 문장 구조 오류 (익명본). 고치려면 아래 LERR 내용을 바꾸면 돼요.
   types: [코드, 유형, 정의, [스스로 점검할 질문…], [[사례번호, 글 종류, 원문(다듬음), 무엇이 문제일까요, 고쳐 쓴 예]…]] */
const LERR={"scope":"[ 기온에 따른 아이스크림 판매 ] 문항의 답안 약 40개","types":[["A","주어와 서술어가 어울리지 않음(호응 오류)","문장의 주어(~은/는/이/가)와 맨 끝 서술어가 짝이 맞지 않아, 주어만 떼어 서술어와 이어 읽으면 말이 안 되는 문장.",["문장의 주어를 찾아 표시했나요? 그 주어와 마지막 서술어만 이어서 읽어도 말이 되나요?","한 주어에 서술어를 두 개 이상 붙이지는 않았나요?","'~은 ~이다'로 쓴 부분에서 뒤에 오는 말이 앞의 말과 같은 종류인가요? (예: '상관관계 여부는 …존재이다'는 어울리지 않음)"],[["A-1","그래프 해석","상관관계 여부는 기온이 높음에도 검색량이 낮은 데이터 존재이다","주어 '상관관계 여부는'과 서술어 '존재이다'가 어울리지 않고, '데이터가'처럼 있어야 할 조사도 빠져 있어요.","기온이 높음에도 검색량이 낮은 데이터가 존재하므로, 기온이 높다고 해서 항상 검색량이 높아지는 것은 아니다."],["A-2","그래프 해석","인과 관계 판단은 인과관계가 있고 추세선이 밀집하여 있다.","하나의 주어 '인과 관계 판단은'에 서술어 두 개('있고', '밀집하여 있다')를 붙였고, 주어와 서술어가 같은 말을 되풀이해요.","인과관계가 있다고 판단한다. 또한 데이터가 추세선 가까이에 모여 있다."],["A-3","그래프 해석","상관관계는 양의 상관관계이고 인과관계는 크다.","'인과관계'는 있다/없다로 말하는 개념인데 '크다'로 끝맺어 주어와 서술어가 맞지 않아요.","상관관계는 양의 상관관계이고, 인과관계도 있다고 판단한다."],["A-4","그래프 해석","X축이 증가하면 Y축이 증가하는 경향을 보이며 그건 상관 관계 여부가 양의 상관 관계다","'그건'이 무엇을 가리키는지 분명하지 않고, '그건 ~ 여부가 ~ 상관 관계다'로 주어가 두 번 나와 호응이 맞지 않아요.","X축이 증가하면 Y축도 증가하는 경향을 보이므로 이 그래프의 상관관계는 양의 상관관계이다."],["A-5","그래프 해석","x축은 기온을 뜻하고, y축은 아이스크림을 검색한다.","주어 'y축은'에 '검색한다'는 어울리지 않아요. 축은 검색하는 주체가 아니라 값을 나타내는 것이에요.","x축은 기온을 뜻하고, y축은 아이스크림 검색량을 뜻한다."]]],["B","문장이 끊기지 않고 너무 길게 이어짐","'~고, ~고, ~며'로 이어 쓰거나 마침표 없이 이어 써서 한 문장이 너무 길어져, 어디까지가 무슨 말인지 따라가기 어려운 글.",["한 문장 안에 '~고', '~며', '~는데'가 세 번 넘게 나오나요?","문장 안에서 뜻이 바뀌는 곳마다 마침표를 찍어 나누어 보았나요?","한 문장에는 한 가지 내용만 담았나요?"],[["B-1","그래프 해석","그래프의 x축이 나타내는 것은 기온이고, y축이 나타내는 것은 아이스크림의 검색량이라고 볼 수 있고, 그래프의 개형은 기온이 증가하면 x축이 증가하고, 아이스크림의 검색량이 증가하면 y축도 증가하기 때문에 양의 상관관계는 x축 증가 + y축 증가라고 볼 수 있고, 그래프에서 상관관계 여부는 기온이 높음에도 검색량이 낮은 데이터가 존재할 수 있다고 할 수 있고, 그래프에서 인과 관계 판단은 기온과 아이스크림의 검색량이 상대적으로 촘촘하게 있기 때문에 강한 상관관계라고 할 수 있고, 그래프에서 데이터들이 추세선과 밀집해 있는 정상 온도는 기온이 높아지면 아이스크림 검색량이 증가하는 경향을 나타낸 것이다.","'~고,'로 여섯 가지 내용을 한 문장에 이어 붙여서 어디가 이유이고 어디가 결론인지 알 수 없어요. 연결이 길어지다 보니 '정상 온도는 …나타낸 것이다'처럼 호응도 어긋났어요.","x축은 기온을, y축은 아이스크림 검색량을 나타낸다. 기온이 증가할 때 검색량도 증가하므로 양의 상관관계이다. 기온이 높은데도 검색량이 낮은 데이터가 있어 인과관계는 단정하기 어렵다. 데이터가 추세선 가까이에 모여 있으므로 강한 상관관계이다. 따라서 기온이 높아지면 아이스크림 검색량이 증가하는 경향이 있다."],["B-2","활용 방안","아이스크림 가게 운영에 도움 되는 방안은 먼저 아이스크림 주문량을 늘리고 직원을 2명 고용하고 여름에는 더우니까 가게 안에 냉방 기구를 설치하고 겨울에는 밖이 추울 수도 있으니 난방 기구를 설치하고 여름에는 한정 상품을 판매하고 겨울에는 따뜻한 간식을 판매할 것이고 여름 한정 상품을 할인 판매하고 인기 있는 상품을 대량으로 주문하면서 가게 인기를 늘릴 것이고 출입문을 편하게 바꿀 것이고 도난을 막을 장치도 만들 것이다.","방안이 열 가지쯤 '~고, ~고, ~것이고'로 한 문장에 이어져서 무엇이 가장 중요한 방안인지, 왜 하는지 알 수 없어요. (구체적인 내용은 일부 일반적인 표현으로 바꿨어요.)","주문량을 늘리고 직원을 2명 고용하겠다. 기온이 높은 여름에는 가게 안에 냉방 기구를 설치하고 한정 상품을 할인 판매하겠다. 기온이 낮은 겨울에는 난방 기구를 설치하고 따뜻한 간식을 함께 판매하겠다."],["B-3","그래프 해석","위 그래프에서 x축은 기온이고, y축은 아이스크림 검색 지수이고 기온에 따른 아이스크림 검색량의 그래프에서 옆에 있는 정보들을 모아 보았을 때 오른쪽 위를 향하는 경향이 보이므로 x축(기온)이 늘어남에 따라 y축(아이스크림 검색량)도 함께 늘어난다는 사실을 알게 되었다","축의 의미를 말하는 문장이 '~이고'로 끝나고 마침표 없이 다음 내용이 이어져, 두 가지 내용(축의 의미, 그래프의 경향)이 한 문장에 섞였어요.","위 그래프에서 x축은 기온이고, y축은 아이스크림 검색 지수이다. 그래프를 보면 오른쪽 위를 향하는 경향이 보이므로, x축(기온)이 늘어남에 따라 y축(아이스크림 검색량)도 함께 늘어난다."],["B-4","그래프 해석","X축은 기온을 뜻하고 Y축은 아이스크림을 뜻하고 X축이 늘어날 때마다 Y축이 늘어나기 때문에 X축과 Y축은 양의 상관관계가 있고 밀집된 정도가 높아 강한 상관관계라고 할 수 있고 인과관계는 그리고 기온이 낮은데도 아이스크림 검색량이 높은 경향을 보이기 때문에 인과관계는 적다 결론적으로는 기온이 높아질수록 아이스크림 검색량이 증가한다고는 할 수 있지만 무조건 늘어난다는 것은 아니다","마침표 없이 한 문장으로 이어져 '축의 의미 → 양의 상관 → 강한 상관 → 인과관계 → 결론'이 한꺼번에 나와요. 중간의 '인과관계는 그리고'는 문장이 끊긴 자리에 연결어가 들어가 비문이 되었어요.","X축은 기온을, Y축은 아이스크림 검색량을 뜻한다. X축이 늘어날 때마다 Y축도 늘어나므로 양의 상관관계가 있고, 데이터가 추세선에 많이 모여 있어 강한 상관관계라고 할 수 있다. 하지만 기온이 낮은데도 검색량이 높은 데이터가 있어 인과관계는 약하다. 결론적으로 기온이 높아질수록 검색량이 증가하는 경향은 있지만 항상 그런 것은 아니다."],["B-5","그래프 해석","이 데이터를 토대로 만들어낸 데이터들이 추세선(보조선)과 밀접한 양이 많을 때 강한 상관관계가 있다고 하는데, 이 그래프도 추세선과 데이터의 정보가 밀접해 있기 때문에 강한 상관관계를 가지고 있다는 것을 알 수 있다 이 그래프는 기온이 낮을 때 아이스크림 검색량이 높은 데이터가 있고, 기온이 높은데도 아이스크림 검색량이 낮은 데이터가 기록되어 있다 이런 데이터는 그래프의 해석에서 큰 영향을 끼치지 않는다 내가 해석한 이 그래프는 기온이 올라감에 따라서 아이스크림 검색량이 점점 증가한다고 생각한다.","문장 끝에 마침표가 없어 '알 수 있다 이 그래프는', '기록되어 있다 이런 데이터는'처럼 문장이 서로 붙어 버렸고, 첫 문장은 주어가 겹쳐 길고 복잡해요.","추세선과 데이터가 가까이 모여 있을수록 강한 상관관계라고 한다. 이 그래프도 데이터가 추세선 가까이에 모여 있으므로 강한 상관관계이다. 기온이 낮은데 검색량이 높은 데이터와 기온이 높은데 검색량이 낮은 데이터도 있지만 전체 경향에는 큰 영향을 주지 않는다. 따라서 기온이 올라갈수록 아이스크림 검색량이 증가한다고 해석할 수 있다."]]],["C","문장이 중간에 끊기거나 끝맺지 못함(미완결)","서술어까지 쓰지 않고 멈추거나, 연결어로 끝나거나, 글자·기호가 깨져서 문장이 마무리되지 않은 글.",["모든 문장이 '~다/~이다/~한다'처럼 끝맺음으로 끝나나요?","'따라서', '또', '그래서' 뒤에 내용을 쓰다가 멈추지 않았나요?","제출하기 전에 마지막 문장까지 소리 내어 읽어 보았나요?"],[["C-1","그래프 해석","그래프에서 X축은 기온, Y축은 검색량을 뜻합니다. 따라서 기온이 높아지면 아이스크림 검색량이 증가하므로 x축이 증가할 때 y축도 증가합","마지막 문장이 '증가합'에서 끊겨 끝맺지 못했어요. 또 '따라서' 앞에 근거가 없어서 '따라서'가 무엇의 결과인지 알 수 없어요.","그래프에서 X축은 기온, Y축은 검색량을 뜻합니다. 점들이 오른쪽 위로 올라가므로 X축이 증가할 때 Y축도 증가합니다. 따라서 기온이 높아지면 아이스크림 검색량이 증가합니다."],["C-2","그래프 해석","데이터들이 추세선과 밀집해 있는 정-+이러한 데이터 간의 관계 해석은 기온이 높아지면 아이스크림 검색량이 증가하는 경향이다.","'있는 정'에서 문장이 끊기고 기호가 섞여 앞 문장이 완성되지 않은 채 다음 문장이 시작돼요.","데이터들이 추세선과 밀집해 있는 정도가 높다. 이러한 데이터 간의 관계를 해석하면 기온이 높아질 때 아이스크림 검색량이 증가하는 경향이 있다."],["C-3","활용 방안","일단 기온이 높을 때(여름)는 아이스크림을 더 많이 주문해 많이 팔고, 기온이 낮을 때는 사람들이 아이스크림을 많이 안 먹으니까 아이스크림을 더 적게 사서 팔 것이다. 직원 수는 온도가 높을 때 사람들이 아이스크림을 더 살 것이니","'직원 수는 …살 것이니'에서 문장이 끝나지 않아, 직원 수를 어떻게 하겠다는 결론이 빠져 있어요.","직원 수는 온도가 높을 때 사람들이 아이스크림을 더 살 것이니 여름에는 직원을 더 많이 뽑을 것이다."],["C-4","그래프 해석","X축은 서울 일평균 기온, Y축은 아이스크림 검색 지수다. 기온이 늘어남에 따라 Y축도 늘어나고 양의 상관관계가 있다. 또 (빈 줄) 인과 관계도 있다 추세선도 밀집하다","'또' 하나만 쓰고 줄이 바뀌어 문장이 미완성으로 남았고, '추세선도 밀집하다'는 서술어가 어색해요.","기온이 늘어남에 따라 Y축도 늘어나므로 양의 상관관계가 있다. 또 데이터가 추세선 가까이에 모여 있으므로 강한 상관관계이다."],["C-5","그래프 해석","또 기온에 따른 아이스크림 검색량 데이터들 중 추세선과 밀집해 있는 정도가 많이 밀집되어 있기 때문에 강한 상관관계를 띤다. 이 데이터들이 기온이 올라 가면","마지막 문장이 '올라 가면'에서 끝나 결론(데이터 간의 관계 해석)이 빠졌어요.","이 데이터들을 보면 기온이 올라갈 때 아이스크림 검색량도 증가하는 경향이 있다."],["C-6","그래프 해석","그래프의 개형은 X축 즉 기온 값이 증가 할 때 마다 Y축 즉 아이스크림 검색량은","'검색량은'으로 끝나 서술어가 없어요.","그래프의 개형은 X축 즉 기온 값이 증가할 때마다 Y축 즉 아이스크림 검색량도 증가하는 모양이다."]]],["D","같은 말을 되풀이함","새로운 정보나 이유 없이 앞에서 한 말을 다른 표현으로 다시 쓰거나, 결론을 근거 자리에 되풀이해 쓴 글.",["이 문장이 앞 문장과 같은 내용이 아닌가요? 새로 알려 주는 것이 있나요?","'~때문에'로 쓴 근거가 결론을 다시 말한 것은 아닌가요?","되풀이한 문장을 지우면 글의 뜻이 달라지나요? 달라지지 않으면 지우거나 새 내용으로 바꿔요."],[["D-1","그래프 해석","X축 값이 증가할 때마다 Y축이 증가하는 경향을 보인다. 그리고 기온이 높아질수록 Y축이 늘어나기 때문에 양의 상관관계이고","앞 문장과 같은 내용('X가 늘면 Y가 늘어난다')을 한 번 더 써서 새로운 정보가 없고, 그 되풀이가 '양의 상관관계'의 근거가 되어 버렸어요.","X축 값이 증가할 때마다 Y축이 증가하는 경향을 보이므로 양의 상관관계이다."],["D-2","활용 방안","기온이 높아지면 판매량과 비례하는 것을 활용해서 가게에 이러한 정보를 얻었기 때문에 가게에 도움이 된다. 따라서 아이스크림 주문량과 직원 수와 같은 방법으로 가게 운영에 도움이 되는 데이터 활용 방법이다. 이러한 방안을 통해 많은 이익을 낼 수 있다.","'도움이 된다'를 '정보를 얻었기 때문에 도움이 된다'로, 다시 '운영에 도움이 되는 방법이다'로 되풀이할 뿐 구체적인 방법(언제 얼마나 주문하는지)이 없어요.","기온이 높아질수록 판매량도 늘어나므로, 기온이 높은 여름에는 아이스크림 주문량을 늘리고 직원 수도 늘릴 것이다."],["D-3","활용 방안","아이스크림 주문량에 데이터를 활용하면 아이스크림이 더 잘 팔릴 것이고, 날씨가 더울 때 아이스크림 증가량이 올라가는 것을 분석 결과로 할 것이다. 이것을 통해 주문량이 올라 잘 팔리고, 날씨가 더울 때 사람들이 아이스크림을 더 많이 살 테니 전체적으로 아이스크림이 잘 팔릴 것이다.","'잘 팔릴 것이다'가 세 번 반복돼요. 어떤 활용을 하는지는 없고 '잘 팔린다'는 결과만 되풀이돼요.","날씨가 더울 때 아이스크림 검색량이 증가하므로, 여름에는 주문량을 평소보다 늘려 재고가 모자라지 않게 할 것이다."],["D-4","그래프 해석","대체적으로 각각의 데이터들을 종합해 그래프로 보면, X의 값이 증가할수록 Y의 값도 증가하는 추세이다. 따라서 서울 일평균 기온과 아이스크림 검색 지수는 양의 상관관계이다. 또한 X의 값, 즉 서울 일평균 기온이 올라가기 때문에 Y의 값, 아이스크림 검색 지수가 증가한다. … 마지막으로 데이터들의 관계, 즉 서울 일평균 기온과 아이스크림 검색량은 양의 상관관계와 인과관계가 있으며, 서울 일평균 기온이 올라갈수록 아이스크림 검색량도 증가한다.","'X가 늘면 Y도 늘어난다'는 같은 내용을 세 번, 표현만 바꿔 다시 써서 글이 길어졌을 뿐 새로운 근거가 없어요.","그래프를 보면 X의 값이 증가할수록 Y의 값도 증가하므로 양의 상관관계이다. 따라서 서울 일평균 기온이 올라갈수록 아이스크림 검색량도 증가한다."],["D-5","그래프 해석","X축이 늘어날 때마다 Y축이 늘어나는 걸 보아 양의 상관관계라고 말할 수 있고, 기온이 올라갈 때마다 검색량이 올라간다는 걸 알 수 있다.","한 문장 안에서 같은 내용(X↑ Y↑)을 '기온', '검색량'이라는 이름만 바꿔 두 번 썼어요. 두 번째 부분이 새로운 해석이 되려면 변수 이름으로 풀어 쓴 결론(근거)과 달라야 해요.","X축이 늘어날 때마다 Y축이 늘어나는 것을 보아 양의 상관관계라고 할 수 있다. 따라서 기온이 높아질수록 아이스크림 검색량이 증가하는 경향이 있다."]]],["E","접속어가 맞지 않음","'따라서·그러므로·하지만·왜냐하면' 같은 연결어를 썼지만, 앞뒤 문장의 관계(원인-결과, 반대 등)와 맞지 않거나 연결어를 겹쳐 쓴 글.",["'따라서/그러므로' 앞 문장이 정말 뒤 문장의 이유인가요?","'하지만' 앞뒤에 서로 반대되는 내용이 있나요?","'~므로 ~므로'처럼 이유를 잇는 말을 한 문장에 겹쳐 쓰지는 않았나요?","연결어를 빼고 읽었을 때 앞뒤가 이어지는지, 그 연결어가 꼭 필요한지 확인했나요?"],[["E-1","그래프 해석","그리고 인과 관계 판단은 기온이 높음에도 검색량이 낮은 데이터가 존재하는 것을 볼 수 있다. 그러므로 이 데이터들이 추세선과 밀집해 있는 정도는 아주 강한 상관관계인 것을 볼 수 있다.","'그러므로' 앞 문장(기온이 높아도 검색량이 낮은 데이터가 있다)은 뒤 문장(추세선과 밀집해서 강한 상관관계다)의 이유가 아니에요. 오히려 반대되는 내용이라 '하지만'이 어울려요.","기온이 높음에도 검색량이 낮은 데이터가 존재하므로 인과관계가 있다고 단정하기는 어렵다. 하지만 대부분의 데이터가 추세선과 밀집해 있어 강한 상관관계라고 할 수 있다."],["E-2","그래프 해석","기온이 높음에도 검색량이 낮은 데이터 존재이므로 강한 상관관계입니다","'기온이 높아도 검색량이 낮은 데이터가 있다'는 것이 '강한 상관관계'의 이유가 되지 못하는데 '~이므로'로 이었어요.","기온이 높음에도 검색량이 낮은 데이터가 존재하지만, 데이터들이 추세선 가까이에 모여 있으므로 강한 상관관계이다."],["E-3","그래프 해석","이 그래프는 기온에 따른 아이스크림 검색량을 뜻한다. 따라서 이 그래프의 X축은 서울의 일평균 기온을 뜻하고, Y축은 아이스크림 검색 지수를 뜻한다.","앞 문장과 뒤 문장은 원인과 결과가 아니라 '설명을 풀어 쓴 것'인데 '따라서'를 썼어요.","이 그래프는 기온에 따른 아이스크림 검색량을 뜻한다. 즉 이 그래프의 X축은 서울의 일평균 기온을, Y축은 아이스크림 검색 지수를 뜻한다."],["E-4","그래프 해석","따라서 추세선에 데이터들이 많이 밀집하여 상관관계는 있지만 \"무조건\" x축이 증가하기 때문에 y축이 증가하는 건 아니므로 인과관계는 없다고 볼 수 있다.","'따라서', '~지만', '~기 때문에', '~므로'가 한 문장에 겹쳐 있어 어떤 말이 어떤 말의 이유인지 알 수 없어요.","추세선에 데이터가 많이 밀집해 있으므로 상관관계는 있다. 하지만 x축이 증가한다고 해서 y축이 항상 증가하는 것은 아니므로 인과관계는 없다고 볼 수 있다."],["E-5","그래프 해석","하지만 기온이 높은데 검색량이 낮거나 기온이 낮은데 검색량이 많은 데이터가 있는 걸 보면 인과관계는 맞지 않는다는 걸 알 수 있다. 하지만 추세선에 많은 데이터가 몰려 있으므로 강한 상관관계를 띠므로 기온이 올라가면 아이스크림 검색량이 증가한다는 사실을 알 수 있다.","'하지만'이 두 번 이어져 앞뒤 관계가 헷갈리고, 마지막 문장에는 '~으므로 ~므로'가 겹쳐 있어요.","기온이 높은데 검색량이 낮은 데이터가 있어 인과관계는 맞지 않는다. 하지만 추세선에 많은 데이터가 몰려 있어 강한 상관관계를 띤다. 따라서 기온이 올라가면 아이스크림 검색량이 증가하는 경향이 있다."],["E-6","그래프 해석","이 그래프에 나타난 데이터가 다른 데이터에 영향을 미치지 않으므로 인과 관계는 없다고 판단할 수 있으며,","'~므로'로 쓴 이유가 그래프에서 읽은 근거가 아니에요. 인과관계가 없다고 판단하려면 '기온이 높은데도 검색량이 낮은 데이터가 있으므로'처럼 그래프에서 확인한 근거가 이유가 되어야 해요.","기온이 높음에도 검색량이 낮은 데이터가 있으므로 인과 관계는 없다고 판단할 수 있다."]]],["F","조사·어미·표현이 잘못되어 문장이 어색함","조사(은/는/의/에)나 어미(~므로, ~기 때문에)를 잘못 쓰거나 같은 뜻의 표현을 겹쳐 써서 문장이 어색해진 글. (단순 맞춤법 오탈자만 있는 문장은 제외)",["'~의 따라', '~함의'처럼 조사가 어색한 곳은 없나요? 소리 내어 읽어 보면 걸리는 곳이 있나요?","같은 뜻의 말(예: '~에도 불구하고'와 '~임에도')을 겹쳐 쓰지는 않았나요?","'~므로 …기 때문에'처럼 이유를 나타내는 말을 한 문장에 두 번 쓰지는 않았나요?","문장 끝을 '~입니다.'와 '있음.'처럼 어색하게 섞어 쓰지 않았나요?"],[["F-1","그래프 해석","온도가 올라가므로 아이스크림의 검색량도 증가하기 때문에 인과관계가 어느 정도 있다","'~므로'와 '~기 때문에'를 겹쳐 써서 이유가 두 번 나오고, 어느 말이 근거인지 모호해요.","온도가 올라갈 때 아이스크림의 검색량도 증가하기 때문에 인과관계가 어느 정도 있다."],["F-2","그래프 해석","예를 들어 겨울에 신상 아이스크림이 나왔는데 맛있으면 겨울이라고 해서 검색량이 낮은 게 아닌 유명세 때문에 검색량이 높게 나올 것이기 때문이다.","'~때문에 … ~것이기 때문이다'로 이유를 나타내는 말이 겹치고, '낮은게아닌 …높게 나올 것이기 때문이다'가 앞 문장과 어떻게 이어지는지 불분명해요.","예를 들어 겨울에 맛있는 신상 아이스크림이 나오면, 기온이 낮아도 유명세 때문에 검색량이 높게 나올 수 있다."],["F-3","그래프 해석","그래프에서 x축은 기온이고 y축은 기온량의 따른 아이스크림 검색량입니다. … 인과 관계 판단은 기온이 높은데 검색량이 높거나, 기온은 높은데 검색량이 낮은 데이터가 있음.입니다","'기온량의 따른'은 조사가 어색하고 '기온량'이라는 말도 맞지 않아요. '있음.입니다'는 문장 끝이 두 가지 모양으로 섞였어요.","그래프에서 x축은 기온이고 y축은 기온에 따른 아이스크림 검색량이다. … 인과 관계를 판단할 때는 기온이 높은데 검색량이 높거나, 기온은 높은데 검색량이 낮은 데이터가 있다."],["F-4","그래프 해석","하지만 기온이 높아짐에도 불과하고 검색량이 낮은 데이터도 존재한다.","'~에도'와 '~에도 불구하고'가 섞여 같은 뜻의 표현이 겹치고 '불과하고'는 맞는 표현이 아니에요.","하지만 기온이 높음에도 검색량이 낮은 데이터도 존재한다. (또는) 기온이 높아졌음에도 불구하고 검색량이 낮은 데이터도 존재한다."],["F-5","그래프 해석","그래프의 개형은 x축이 증가하면 y축도 증가함의 양의 상관관계이다","'증가함의 양의 상관관계'처럼 명사형 '~함' 뒤에 조사 '의'를 붙여 뜻이 불분명해졌어요.","그래프의 개형은 x축이 증가하면 y축도 증가하는 양의 상관관계이다."]]],["G","문장이 서로 이어지지 않고 나열만 함","'~이다.' 문장을 줄줄이 나열하거나 '그리고'만 반복할 뿐, 주장과 그 이유(근거)가 서로 이어지지 않는 글.",["각 주장 바로 뒤에 그 근거가 있나요? (~하므로, ~때문에)","문장 사이에 '왜냐하면', '그래서'를 넣어 읽으면 말이 되나요?","'그리고'를 몇 번 썼나요? 앞뒤가 정말 같은 종류의 내용인가요?","빈칸 채우기처럼 항목별로 한 줄씩만 쓰지 않았나요? 그 항목을 서로 이어 보세요."],[["G-1","그래프 해석","이 그래프의 x축은 서울 일평균 기온을 나타내고 y축은 아이스크림 검색 지수를 나타낸다. 그래프의 모양은 x축이 증가하면 y축이 증가하는 양의 상관관계의 모양을 나타내고 있다 하지만 평균 기온이 높음에도 검색량이 낮은 데이터가 존재한다 추세선과 밀집해 있는 데이터가 많아 강한 상관관계를 보인다 따라서 이 그래프를 해석하자면 기온이 높아지면 아이스크림 검색량이 증가하는 경향을 보인다","내용은 갖췄지만 '~이다/~있다'를 줄줄이 늘어놓기만 하고, 각 주장 바로 뒤에 이유가 이어지지 않았어요. 마지막 '따라서'만 있어서 결론이 앞 내용 전체에서 나오는 것처럼 보이지 않아요.","x축이 증가하면 y축도 증가하므로 양의 상관관계이다. 하지만 평균 기온이 높음에도 검색량이 낮은 데이터가 존재하므로 인과관계는 단정하기 어렵다. 데이터가 추세선과 밀집해 있으므로 강한 상관관계이다. 따라서 기온이 높아지면 아이스크림 검색량이 증가하는 경향이 있다."],["G-2","그래프 해석","x축은 서울 일평균 기온이고, y축은 아이스크림 검색 지수이다. 상관 관계 여부는 양의 상관관계이다. 데이터들이 추세선과 밀집해 있는 정도를 보면 강한 상관관계이다. 그래프의 개형과 데이터 간의 관계 해석을 보면 x축이 늘어남에 따라 y축이 함께 늘어난다. 서울 일평균 기온에 따른 아이스크림 검색 지수는 늘어나는 성향이 있다.","안내문의 항목(상관관계 여부, 추세선, 관계 해석)을 한 줄씩 채웠을 뿐 '왜 그렇게 말할 수 있는지'가 없고 문장끼리 이어지지 않아요.","x축이 늘어남에 따라 y축도 함께 늘어나므로 양의 상관관계이다. 데이터들이 추세선과 밀집해 있으므로 강한 상관관계이다. 따라서 서울 일평균 기온이 높아질수록 아이스크림 검색 지수도 높아지는 성향이 있다."],["G-3","활용 방안","데이터를 분석해 보면 기온이 높아질수록 아이스크림 검색량이 높아지는 것을 알 수 있다. 내가 만약 아이스크림 사장님이 된다면 할인 행사와 직원 수에 이 분석 결과를 이용할 것이다. 기온이 높아질수록 할인 행사를 자주 한다. 그리고 사람들을 많이 불러온 뒤 수익을 얻는다. 그리고 여름에 직원을 많이 채용해 가게를 빠르고 효율적으로 운영한다.","'그리고'로 문장을 이어 붙였지만 '할인 행사 → 사람이 모임 → 수익'이 왜 그런지 이유 표현이 없고, 마지막 문장은 앞 문장과 이어지지 않는 새 이야기예요.","기온이 높아질수록 검색량이 증가하므로 여름에는 할인 행사를 자주 열어 손님을 모으고, 손님이 많아지는 여름에는 직원을 더 채용해 가게를 빠르게 운영할 것이다."],["G-4","그래프 해석","X축은 기온을 뜻하고, Y축은 아이스크림의 검색량이다. 상관관계는 양의 상관관계이고, X축이 증가하면 Y축도 같이 증가한다. 평균 기온이 낮아도 검색량이 높을 수 있고, 또 평균 기온이 높은데 검색량이 낮을 수도 있다. 이 그래프는 강한 상관관계이다. 그리고 기온이 올라가면 아이스크림 검색량이 증가한다.","'그리고', '또'로만 이어서 '강한 상관관계이다'와 '기온이 올라가면 검색량이 증가한다'가 서로 어떤 관계인지(이유, 결론) 알 수 없어요.","X축이 증가하면 Y축도 같이 증가하므로 양의 상관관계이다. 평균 기온이 낮아도 검색량이 높거나 기온이 높은데 검색량이 낮은 데이터도 있지만, 대부분의 데이터가 추세선과 가까워 강한 상관관계이다. 따라서 기온이 올라가면 아이스크림 검색량이 증가한다."]]],["H","문체가 섞임","한 글 안에서 '~다'체와 '~요/~습니다'체, 혼잣말투와 설명하는 글투가 뒤섞이거나 문장 끝 모양이 일정하지 않은 글.",["글 전체를 '~다'체로 통일했나요?","'~거든요', '~있어요', '~잘 모르겠습니다'처럼 말하듯 쓴 곳은 없나요?","설명하는 글에서는 '내 생각'보다 그래프에서 읽은 내용을 먼저 쓰고 있나요?"],[["H-1","그래프 해석","그래프의 모양은 분산형이고 상관관계로 양의 상관관계가 있다 인과관계는 잘 모르겠습니다 추세선과 밀집되어 있는 정도는 많이 밀집되어 있다 따라서 이 그래프는 X축이 높아질수록 Y축이 높아진다는 것을 알 수 있다","'~있다' 다음에 '잘 모르겠습니다'로 문장 끝 모양이 바뀌고, 한 문장 안에서도 '있다/모르겠습니다'가 섞여 글의 말투가 일정하지 않아요.","그래프의 모양은 분산형이고, 양의 상관관계가 있다. 인과관계는 이 그래프만으로는 판단하기 어렵다. 추세선과 밀집된 정도가 높다. 따라서 이 그래프는 X축이 높아질수록 Y축도 높아진다는 것을 알 수 있다."],["H-2","그래프 해석","아이스크림 검색량은 y축, 날씨 기온은 x축을 뜻해요 아이스크림 검색량과 날씨 기온은 강한 상관관계에 있어요 그리고 이거는 양의 상관관계에 있어요 그 이유는 x축이 증가하면 y축도 증가하거든요 인과관계는 기온은 낮은데 검색량이 높거나 기온은 높은데 검색량이 낮은 데이터가 있고요 데이터 간의 관계 해석 기온이 올라가면 아이스크림 검색량이 높아집니다","'~해요, ~거든요, ~있고요, ~높아집니다'처럼 말하듯 쓴 구어체와 '~합니다'가 섞였고, 설명하는 글의 '~다'체와 어울리지 않아요.","아이스크림 검색량은 y축, 날씨 기온은 x축을 뜻한다. 아이스크림 검색량과 날씨 기온은 강한 상관관계에 있고, 양의 상관관계이다. 그 이유는 x축이 증가하면 y축도 증가하기 때문이다. 인과관계는 기온은 낮은데 검색량이 높거나 기온은 높은데 검색량이 낮은 데이터가 있어 판단하기 어렵다. 따라서 기온이 올라가면 아이스크림 검색량이 높아지는 경향이 있다."]]],["I","무슨 말인지 이해하기 어려움","단어는 이어져 있지만 누가·무엇을·어떻게 하는지 분명하지 않거나 앞뒤 논리가 맞지 않아 읽고도 뜻을 알 수 없는 글.",["친구에게 읽어 주면 한 번에 무슨 말인지 알아들을까요?","'무엇을(주문량, 직원 수, 할인 행사 등) 어떻게 하겠다'가 분명히 쓰여 있나요?","한 문장에 이유가 두 개 이상 섞여 있지는 않나요?"],[["I-1","활용 방안","내가 만약 아이스크림 사장님이 되고 여름에 아이스크림을 주문한다면 아이스크림 주문량은 더 많이 늘어날 수 있다. 직원 수는 내가 돈을 더 많이 벌기 위해 직원 수는 2~3명 정도 뽑으면 돈이 더 많아지고 직원 월급을 더 많이 챙겨줘서","'주문하면 주문량이 늘어난다'는 같은 말이 맞물려 있고, 직원 수 문장은 '직원 수는 … 직원 수는'으로 주어가 겹치고 '뽑으면 돈이 더 많아지고'의 이유가 불분명한 채 '챙겨줘서'로 끝나 뜻을 알 수 없어요.","여름에는 기온이 높아 아이스크림 검색량이 늘어나므로 아이스크림 주문량을 늘릴 것이다. 또 손님이 많아지므로 여름에는 직원을 2~3명 더 뽑아 가게를 운영할 것이다."],["I-2","활용 방안","나는 아이스크림 주문을 여름에 해서 우리 가게의 효율적인 결과를 가져올 것이다. 또한 할인 행사도 여름에 할 것이다.","'주문을 여름에 해서'가 어떻게 '효율적인 결과'로 이어지는지 설명이 없고, 무엇을 얼마나 어떻게 하겠다는 방안이 보이지 않아요.","여름에는 기온이 높아 아이스크림 검색량이 늘어나므로 주문량을 늘리고, 할인 행사도 여름에 열어 손님을 모을 것이다."]]]]};
const leBody=t=>`<p style="margin:12px 0 6px;line-height:1.7"><b>정의</b> ${esc(t[2])}</p><div class="sbox"><b>🔎 스스로 점검할 질문</b><ul class="leq">${t[3].map(q=>`<li>${esc(q)}</li>`).join('')}</ul></div>`
    +t[4].map(c=>`<div class="sbox lec"><h4>사례 ${esc(c[0])} <small style="color:var(--sub);font-weight:normal">${esc(c[1])}</small></h4><div class="lel">원문(다듬음)</div><div class="leo">${esc(c[2])}</div><p style="margin:6px 0 8px;line-height:1.7"><b>무엇이 문제일까요?</b> ${esc(c[3])}</p><div class="lel">고쳐 쓴 예</div><div class="lef">${esc(c[4])}</div></div>`).join('');
const leLink=c=>{const t=c&&LERR.types.find(x=>x[0]===c);return t?`<details class="les esl"><summary style="font-size:15px">🧩 논리적 오류 모음 <span class="lc">${t[0]}</span><b>${esc(t[1])}</b> 열어 보기</summary>${leBody(t)}</details>`:''}; // 피드백 고칠 점 아래 붙는 유형 토글

  app.innerHTML=`<p><button class="ghost" onclick="essayHome()">← 글 피드백 받기</button></p><h2>🧩 논리적 오류 모음</h2>`
  +`<div class="box"><b>이 자료의 범위</b><p style="margin:6px 0 0;line-height:1.7">${esc(LERR.scope)}</p></div>`
  +T.map(t=>`<details class="box les" id="le${t[0]}"><summary><b><span class="lc">${t[0]}</span>${esc(t[1])}</b> <small style="color:var(--sub);font-size:14px">사례 ${t[4].length}개</small></summary>`

/* ===== 논술 피드백 화면 ('✍️ 피드백 받기') =====
   과제·판정규칙·문구는 서버(essayInfo)가 시트에서 보내 주고, 점검은 이 화면에서 바로 해요. 결과와 글은 essaySave로 가명ID와 함께 저장돼요. */
const ESALL={통과:'논리적임',조금:'조금 더',다시:'다시 써 보기',판정안함:'판정 안 함'};
function esHTML(fb,sp,ph){const P=Object.assign({},ESPH,ph||{}),
    qh=x=>esc(String(x).replace(/」\s*(?:의\s*)?다음 문장\s*「/g,'」의 다음 문장「')).replace(/「([^」]*)」\s*/g,'<span class="esq">「$1」</span>'),top={통과:['🎉','var(--ok)'],조금:['🙂','var(--butter)'],다시:['✏️','var(--peach)'],판정안함:['📝','#eef1f8']}[fb.all]||['📝','#eef1f8'];
  return `<div class="box" style="margin-top:14px"><p style="margin:0 0 10px;font-size:13px;color:var(--sub)">ⓘ ${esc(fb.head)}</p><div style="background:${top[1]};border-radius:12px;padding:10px 14px;font-weight:600">${top[0]} ${esc(fb.msg)}</div>`
  +(fb.fix.length>1?`<h4 style="margin:12px 0 6px">고칠 점</h4><ol style="margin:0;padding-left:20px;line-height:1.7">${fb.fix.map((x,i)=>`<li>${qh(x)}${leLink((fb.fixT||[])[i])}</li>`).join('')}</ol>`:fb.fix.length?`<h4 style="margin:12px 0 6px">고칠 점</h4><p style="margin:0;line-height:1.7">${qh(fb.fix[0])}</p>${leLink((fb.fixT||[])[0])}`:'')
  +(fb.good?`<h4 style="margin:12px 0 6px">잘한 점</h4><p style="margin:0;line-height:1.7">${qh(fb.good)}</p>`:'')
  +(fb.tips.length?`<p style="margin:12px 0 0;color:var(--sub);line-height:1.7">${fb.tips.map(qh).join('<br>')}</p>`:'')
  +((fb.check||[]).length?`<h4 style="margin:14px 0 6px">✅ 통과했어도 스스로 한 번 더</h4><ul style="margin:0;padding-left:20px;line-height:1.7">${fb.check.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p style="margin:6px 0 0;font-size:13px;color:var(--sub)">자동 점검은 내용이 맞는지까지는 못 봐요.</p>`:'')
  +(sp.length?`<h4 style="margin:14px 0 6px">${esc(P['맞춤법'])}</h4><ul style="margin:0;padding-left:20px;line-height:1.7">${sp.map(s=>`<li>'${esc(s[0])}' → '${esc(s[1])}'${s[2]?` <small style="color:var(--sub)">${esc(s[2])}</small>`:''}</li>`).join('')}</ul>`:'')+'</div>'}
async function essayView(tid){here('essay',{tid});document.querySelectorAll('.modal.info').forEach(x=>x.remove());app.innerHTML='불러오는 중...';
  const r=await get('essay',()=>api('essayInfo'));if(!r||r.error)return app.innerHTML=esc((r&&r.error)||'불러오지 못했어요.');

<!-- ===== 🧹 '정돈' 레이어 (tidy-layer) =====
     원본·apple-layer·quiet-layer·dark-layer는 그대로 두고, dark-layer 블록 바로 뒤(개발자 도구 막기 script 앞)에 붙여요.
     이 블록만 지우면 지금 화면으로 돌아가요. 색은 dark-layer 변수를 그대로 써서 다크 화면과 맞춰요.
     하는 일: ① 모서리·간격을 한 가지 규칙으로 ② 머리글을 한 줄·같은 높이로 ③ 목차에 들여쓰기 선과 '지금 보는 곳' 표시
             ④ 오른쪽 칸(시각·타이머)을 한 덩어리로 ⑤ 카드·상자·창(모달)의 여백과 제목 줄 통일 -->
<style id="tidy-layer">
:root{--t-r1:8px;--t-r2:12px;--t-r3:16px;--t-head-h:56px}

/* ① 글자: 본문은 그대로, 제목 크기만 단계로 정리 */
h2{font-size:26px;line-height:1.3;margin:4px 0 20px}
h3{font-size:19px;line-height:1.35}
.sbox h4,#toc>h4{font:700 12px/1.4 'KoPubWorld Dotum','Malgun Gothic',sans-serif;letter-spacing:.06em;color:var(--sub);margin:0 0 8px}

/* ② 머리글: 한 줄, 높이 56px 고정. 학교·버전은 작은 알약, 이름 옆에 구분선, 로그아웃은 글자 버튼 */
header{height:var(--t-head-h);padding:0 20px;gap:14px;flex-wrap:nowrap}
header>b{font-size:19px}
header>span:not(#tm){font-size:12px;color:var(--sub);padding:1px 9px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
#hn{border-radius:var(--t-r2);padding:4px 12px;max-width:40%}
#who{gap:6px}
#who>span:last-of-type{font-size:14px;color:var(--ink);padding-right:10px;margin-right:2px;border-right:1px solid var(--line);white-space:nowrap}
#who button,#tg{padding:6px 12px;font-size:13.5px;border-radius:var(--t-r1)}
#who button:last-child{background:transparent;border-color:transparent;color:var(--sub)}
@media(hover:hover){#who button:last-child:hover{color:var(--ink);background:var(--d-hover)}}
@media(max-width:600px){header{height:auto;min-height:52px;padding:8px 12px;flex-wrap:wrap}#who>span:last-of-type{border:0;padding-right:0}}

/* 세 칸 배치: 가운데 글 폭을 읽기 좋게, 위아래 여백 통일 */
@media(min-width:1200px){#wrap.hasToc{grid-template-columns:260px minmax(0,1fr) 300px}}
.hasToc main{padding-top:28px;padding-bottom:80px;max-width:1040px}
.hasToc #toc{padding:20px 12px 60px 14px}
#side{padding:20px 16px 40px}

/* ③ 목차: 단계마다 세로 선으로 들여쓰기, 지금 보는 활동은 왼쪽 막대로 표시 */
.tt{border-radius:var(--t-r1);padding:7px 10px;font-size:14.5px}
.tl{margin-left:12px;padding-left:8px;border-left:1px solid var(--line)}
.ta{margin-left:14px;padding-left:8px;border-left:1px solid var(--line)}
.tt.on{box-shadow:inset 3px 0 0 var(--q-active-ink);font-weight:700}
.lt .pk{font-size:10.5px;padding:0 6px}
#toc .sbox{margin-top:20px!important}

/* ④ 오른쪽 칸: '지금 시각'과 두 타이머를 한 상자처럼 붙이고, 나머지 상자는 같은 간격 */
#side .sbox{border-radius:var(--t-r2);padding:14px;margin:0 0 12px!important}
#side .nowc{margin-bottom:0!important;padding:8px 12px;border-bottom:0;border-radius:var(--t-r2) var(--t-r2) 0 0}
#side .tm2{padding:0;border-radius:0 0 var(--t-r2) var(--t-r2);margin-bottom:6px!important}
#side .tm2 .tmb{padding:10px 8px}
#side .tm2 .clk{font-size:19px}
#side .tm2+p{font-size:12px!important;margin:0 2px 16px!important;opacity:.85}
#side .tt{padding:6px 8px;font-size:14px}
#mbx .mbt{border-radius:var(--t-r1)}

/* ⑤ 카드: 같은 높이·여백, 진도 막대는 항상 맨 아래, 마우스를 올리면 2px 떠오름 */
.grid{gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{border-radius:var(--t-r3);padding:20px 22px;min-height:112px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;transition:transform .2s var(--ad-out,ease),border-color .15s,box-shadow .2s}
.card b{font-size:17px;line-height:1.4}
.card>.bar{margin-top:auto;width:100%}
@media(hover:hover){.card:hover{transform:translateY(-2px)}}

/* '← 돌아가기' 버튼: 큰 테두리 버튼 대신 제목 위 작은 글자 버튼 */
#app>p:first-child{margin:0 0 4px}
#app>p:first-child>button.ghost:only-child{background:transparent;border-color:transparent;color:var(--sub);padding:4px 8px 4px 4px;font-size:14px}
@media(hover:hover){#app>p:first-child>button.ghost:only-child:hover{color:var(--ink);background:var(--d-hover)}}

/* 상자·버튼·칩: 모서리 규칙 하나로 (작은 것 8 · 버튼 10 · 상자 16), 필터 칩은 알약 */
.box{border-radius:var(--t-r3);padding:22px 24px;margin-bottom:18px}
.box.sec{padding:22px 26px}
details.sec>summary h3{font-size:20px}
button.main,button.ghost{border-radius:10px}
button.main{font-weight:700}
.chip{border-radius:999px;padding:6px 14px;font-size:14px}
.msg{border-radius:var(--t-r1);font-size:14.5px}
.mrow{flex-wrap:wrap;row-gap:8px;border-radius:var(--t-r2)}
.mrow .mtx{flex:1 1 100%}   /* 관리자 목록: 글은 첫 줄 전체, 버튼들은 그 아래 한 줄로 */

/* 표 목록(진도·성적·이력): 바깥 테두리를 둥근 틀 하나로 */
.wrap:has(>table:not(.tb)){border:1px solid var(--line);border-radius:var(--t-r2)}
.wrap>table:not(.tb){border-style:hidden}

/* 창(모달): 제목 줄을 위에 고정하고 아래 선으로 내용과 나눔 (창이 길어 스크롤해도 '닫기'가 보여요) */
.modal .mb{border-radius:var(--t-r3)}
.modal .mb:has(>.row:first-child){padding-top:0}
.modal .mb>.row:first-child{position:sticky;top:0;z-index:2;margin:0 -22px 14px!important;padding:16px 22px 12px;background:inherit;border-bottom:1px solid var(--line)}

/* 로그인 상자: 여백 넉넉히, 들어가기 버튼은 꽉 차게 */
.narrow{padding:28px 28px 22px;border-radius:20px}
.narrow h2{margin:0 0 16px}
.narrow #go{width:100%;min-height:44px;margin-top:6px}
</style>
<script>
/* v163 개발자 도구 막기 (학생만, 관리자는 그대로 쓸 수 있음)
   1) F12, Ctrl+Shift+I/J/C, Ctrl+U 막기  2) 오른쪽 클릭 막기
   3) 개발자 도구가 열리면 debugger에서 멈추고, 넘기면 화면을 가림 */
(function(){
  const free=()=>{try{return !!(S.user&&S.user.role==='관리자')}catch(e){return false}};
  addEventListener('keydown',e=>{if(free())return;const c=e.code,k=(e.key||'').toUpperCase(),m=e.ctrlKey||e.metaKey;
    const hit=c==='F12'||k==='F12'||(m&&(e.shiftKey||e.altKey)&&(['KeyI','KeyJ','KeyC'].includes(c)||'IJC'.includes(k)&&k.length===1))||(m&&(c==='KeyU'||k==='U'));
    if(hit){e.preventDefault();e.stopPropagation()}},true);
  addEventListener('contextmenu',e=>{if(!free())e.preventDefault()},true);
  let cv=null;
  const show=on=>{if(on&&!cv){cv=document.createElement('div');cv.id='devcover';
      cv.style.cssText='position:fixed;inset:0;z-index:2147483647;background:#fff;display:flex;align-items:center;justify-content:center;font:700 clamp(28px,6vw,64px) "Gowun Dodum",sans-serif;color:#e53935;text-align:center;padding:16px';
      cv.textContent='수업에 집중해주세요 !!';document.body.appendChild(cv)}
    else if(!on&&cv){cv.remove();cv=null}};
  setInterval(()=>{if(free()){show(false);return}const t=performance.now();debugger;show(performance.now()-t>100)},1000);
})();
</script>
