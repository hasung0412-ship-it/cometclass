<!-- ===== 🧹 '정돈' 레이어 (tidy-layer) =====
     원본·apple-layer·quiet-layer·dark-layer는 그대로 두고, dark-layer 블록 바로 뒤(개발자 도구 막기 script 앞)에 붙여요.
     이 블록만 지우면 지금 화면으로 돌아가요. 색은 dark-layer 변수를 그대로 써서 다크 화면과 맞춰요.
     하는 일: ① 모서리·간격을 한 가지 규칙으로 ② 머리글을 한 줄·같은 높이로 ③ 목차에 들여쓰기 선과 '지금 보는 곳' 표시
             ④ 오른쪽 칸(시각·타이머)을 한 덩어리로 ⑤ 카드·상자·창(모달)의 여백과 제목 줄 통일 -->
<style id="tidy-layer">
:root{--t-r1:8px;--t-r2:12px;--t-r3:16px;--t-head-h:56px}

/* ① 글자: 본문은 그대로, 제목 크기만 단계로 정리 */
h2{font-size:26px;line-height:1.3;margin:4px 0 20px}
h3{font-size:19px;line-height:1.35}
.sbox h4,#toc>h4{font:700 12px/1.4 'KoPubWorld Dotum','Malgun Gothic',sans-serif;letter-spacing:.06em;color:var(--sub);margin:0 0 8px}

/* ② 머리글: 한 줄, 높이 56px 고정. 학교·버전은 작은 알약, 이름 옆에 구분선, 로그아웃은 글자 버튼 */
header{height:var(--t-head-h);padding:0 20px;gap:14px;flex-wrap:nowrap}
header>b{font-size:19px}
header>span:not(#tm){font-size:12px;color:var(--sub);padding:1px 9px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
#hn{border-radius:var(--t-r2);padding:4px 12px;max-width:40%}
#who{gap:6px}
#who>span:last-of-type{font-size:14px;color:var(--ink);padding-right:10px;margin-right:2px;border-right:1px solid var(--line);white-space:nowrap}
#who button,#tg{padding:6px 12px;font-size:13.5px;border-radius:var(--t-r1)}
#who button:last-child{background:transparent;border-color:transparent;color:var(--sub)}
@media(hover:hover){#who button:last-child:hover{color:var(--ink);background:var(--d-hover)}}
@media(max-width:600px){header{height:auto;min-height:52px;padding:8px 12px;flex-wrap:wrap}#who>span:last-of-type{border:0;padding-right:0}}

/* 세 칸 배치: 가운데 글 폭을 읽기 좋게, 위아래 여백 통일 */
@media(min-width:1200px){#wrap.hasToc{grid-template-columns:260px minmax(0,1fr) 300px}}
.hasToc main{padding-top:28px;padding-bottom:80px;max-width:1040px}
.hasToc #toc{padding:20px 12px 60px 14px}
#side{padding:20px 16px 40px}

/* ③ 목차: 단계마다 세로 선으로 들여쓰기, 지금 보는 활동은 왼쪽 막대로 표시 */
.tt{border-radius:var(--t-r1);padding:7px 10px;font-size:14.5px}
.tl{margin-left:12px;padding-left:8px;border-left:1px solid var(--line)}
.ta{margin-left:14px;padding-left:8px;border-left:1px solid var(--line)}
.tt.on{box-shadow:inset 3px 0 0 var(--q-active-ink);font-weight:700}
.lt .pk{font-size:10.5px;padding:0 6px}
#toc .sbox{margin-top:20px!important}

/* ④ 오른쪽 칸: '지금 시각'과 두 타이머를 한 상자처럼 붙이고, 나머지 상자는 같은 간격 */
#side .sbox{border-radius:var(--t-r2);padding:14px;margin:0 0 12px!important}
#side .nowc{margin-bottom:0!important;padding:8px 12px;border-bottom:0;border-radius:var(--t-r2) var(--t-r2) 0 0}
#side .tm2{padding:0;border-radius:0 0 var(--t-r2) var(--t-r2);margin-bottom:6px!important}
#side .tm2 .tmb{padding:10px 8px}
#side .tm2 .clk{font-size:19px}
#side .tm2+p{font-size:12px!important;margin:0 2px 16px!important;opacity:.85}
#side .tt{padding:6px 8px;font-size:14px}
#mbx .mbt{border-radius:var(--t-r1)}

/* ⑤ 카드: 같은 높이·여백, 진도 막대는 항상 맨 아래, 마우스를 올리면 2px 떠오름 */
.grid{gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{border-radius:var(--t-r3);padding:20px 22px;min-height:112px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;transition:transform .2s var(--ad-out,ease),border-color .15s,box-shadow .2s}
.card b{font-size:17px;line-height:1.4}
.card>.bar{margin-top:auto;width:100%}
@media(hover:hover){.card:hover{transform:translateY(-2px)}}

/* '← 돌아가기' 버튼: 큰 테두리 버튼 대신 제목 위 작은 글자 버튼 */
#app>p:first-child{margin:0 0 4px}
#app>p:first-child>button.ghost:only-child{background:transparent;border-color:transparent;color:var(--sub);padding:4px 8px 4px 4px;font-size:14px}
@media(hover:hover){#app>p:first-child>button.ghost:only-child:hover{color:var(--ink);background:var(--d-hover)}}

/* 상자·버튼·칩: 모서리 규칙 하나로 (작은 것 8 · 버튼 10 · 상자 16), 필터 칩은 알약 */
.box{border-radius:var(--t-r3);padding:22px 24px;margin-bottom:18px}
.box.sec{padding:22px 26px}
details.sec>summary h3{font-size:20px}
button.main,button.ghost{border-radius:10px}
button.main{font-weight:700}
.chip{border-radius:999px;padding:6px 14px;font-size:14px}
.msg{border-radius:var(--t-r1);font-size:14.5px}
.mrow{flex-wrap:wrap;row-gap:8px;border-radius:var(--t-r2)}
.mrow .mtx{flex:1 1 100%}   /* 관리자 목록: 글은 첫 줄 전체, 버튼들은 그 아래 한 줄로 */

/* 표 목록(진도·성적·이력): 바깥 테두리를 둥근 틀 하나로 */
.wrap:has(>table:not(.tb)){border:1px solid var(--line);border-radius:var(--t-r2)}
.wrap>table:not(.tb){border-style:hidden}

/* 창(모달): 제목 줄을 위에 고정하고 아래 선으로 내용과 나눔 (창이 길어 스크롤해도 '닫기'가 보여요) */
.modal .mb{border-radius:var(--t-r3)}
.modal .mb:has(>.row:first-child){padding-top:0}
.modal .mb>.row:first-child{position:sticky;top:0;z-index:2;margin:0 -22px 14px!important;padding:16px 22px 12px;background:inherit;border-bottom:1px solid var(--line)}

/* 로그인 상자: 여백 넉넉히, 들어가기 버튼은 꽉 차게 */
.narrow{padding:28px 28px 22px;border-radius:20px}
.narrow h2{margin:0 0 16px}
.narrow #go{width:100%;min-height:44px;margin-top:6px}
</style>
