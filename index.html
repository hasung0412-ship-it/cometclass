<header><button class="ghost" id="tg" onclick="$('#toc').classList.toggle('open')">☰ 목차</button><b id="hm" role="button" tabindex="0" title="처음 화면으로" style="cursor:pointer">🌠 혜성특급 </b><span>배곧해솔중학교 (v180)</span><span id="tm" class="tmc"></span><div id="hn" role="button" tabindex="0" title="공지 모두 보기"></div><div id="who"></div></header>
<div id="wrap"><aside id="toc"></aside><main id="app"></main><aside id="side"></aside></div><div id="sv"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwLLifk0o9iQ4pEEg1Owk8kzLDZc9b5xhTDTpzSzuRBdgkgqelYvBR_RpcgNHpUBqoA/exec';
const $=s=>document.querySelector(s),app=$('#app');
const S={token:sessionStorage.getItem('t')||'',user:null,menu:null,preview:false,sel:{},sub:'',asub:'',at:null,tocOpen:{},ayear:''};let mem={};
// 받아 둔 내용이 있으면 1분이 지났어도 바로 보여 주고, 새 내용은 뒤에서 조용히 받아 둠 (화면 넘길 때마다 서버를 3~4초씩 기다리지 않게). force면 지금 새로 받아 옴
const memT={},memR={},memP={};async function get(k,fn,force){if(!force&&mem[k]){if(Date.now()-(memT[k]||0)>=60000&&!memR[k]){const tk=S.token;memR[k]=Promise.resolve().then(fn).then(r=>{if(r&&!r.error&&S.token===tk){mem[k]=r;memT[k]=Date.now();if(k==='toc')renderToc();if(k==='info')hdrNotice()}}).catch(()=>{}).finally(()=>{delete memR[k]})}return mem[k]}
  const r=await(force?fn():(memP[k]=memP[k]||Promise.resolve().then(fn).finally(()=>{delete memP[k]})));if(!r.error){mem[k]=r;memT[k]=Date.now()}return r} // 같은 내용을 받는 중이면 한 번만 물어봄
/* ---- 임시저장(입력 중인 답 자동 저장) ---- */
const DR={};let dtm=null,dretry=null;
const dkey=(s,n,a,q)=>`hd|${S.user?S.user.id:''}|${s}|${n}|${a}|${q}`;
const isAft=()=>!!S.user&&/^after\d+$/i.test(S.user.sid||S.user.id);
const hkey=(s,n,a,q)=>`hs|${S.user?S.user.id:''}|${s}|${n}|${a}|${q}`;
function clearDraft(no,act,q){const k=dkey(S.sub,no,act,q);delete DR[k];if(isAft())return;try{localStorage.removeItem(k)}catch(e){}} // 방과후 계정은 이 기기에도 입력을 남김(서버 저장이 우선)
function loadLocal(q){try{const a=S.at;return a&&a.act?JSON.parse(localStorage.getItem(dkey(a.sub,a.no,a.act,q))||'null'):null}catch(e){return null}}
function setSv(t,c){const e=$('#sv');e.textContent=t;e.className=c||'';e.style.display='block';clearTimeout(setSv.h);if(c==='ok')setSv.h=setTimeout(()=>e.style.display='none',2500)}
function collect(bx){if(bx.dataset.etc)return [...bx.querySelectorAll('.ib')].map((x,k)=>`${k+1}: ${x.type==='checkbox'?(x.checked?'1':'0'):x.value}`).join('\n');const bl=[...bx.querySelectorAll('.blank')];if(bl.length)return bl.map((x,k)=>`${k+1}: ${x.value.trim()}`).join('\n');const rd=bx.querySelector('input[type=radio]:checked');if(rd)return rd.value;const el=bx.querySelector('.ans,.free,textarea');return el?el.value:''}
function onEdit(e){const a=S.at;if(S.preview||!a||!a.act||e.target.closest('.trace,.runb,.qz,.sp2'))return;let q,text;
  if(a.act==='개념'){const el=e.target.closest('.ib');if(!el)return;q=+el.dataset.i;text=el.type==='checkbox'?(el.checked?'1':'0'):el.value}
  else{const bx=e.target.closest('.box[data-q]');if(!bx||(e.target.closest('.ib')&&!bx.dataset.etc))return;q=+bx.dataset.q;text=collect(bx)}
  const k=dkey(a.sub,a.no,a.act,q);DR[k]={sub:a.sub,no:a.no,act:a.act,q,text,t:Date.now()};
  try{localStorage.setItem(k,JSON.stringify({t:Date.now(),text}))}catch(_){}
  setSv('✏️ 입력 중...','');clearTimeout(dtm);dtm=setTimeout(flushDrafts,3000)}
async function flushDrafts(){clearTimeout(dretry);const keys=Object.keys(DR);if(!keys.length)return;setSv('💾 저장 중...','');let bad=false;
  for(const k of keys){const d=DR[k];if(!d)continue;const r=await api('draft',{sub:d.sub,no:d.no,act:d.act,q:d.q,text:d.text});if(r.error){if(/저장할 수 없/.test(r.error)){delete DR[k];continue}bad=r.busy&&bad!==true?'busy':true;continue}if(DR[k]&&DR[k].t===d.t)delete DR[k]}
  if(bad==='busy'){setSv('💾 잠시 뒤 다시 저장할게요 (내용은 이 기기에 보관 중)','');dretry=setTimeout(flushDrafts,6000+Math.random()*6000)}
  else if(bad){setSv('⚠ 저장이 안 됐어요. 연결되면 자동으로 다시 저장해요 (내용은 이 기기에 보관 중)','bad');dretry=setTimeout(flushDrafts,8000)}else setSv('💾 저장됐어요','ok')}
function beaconDrafts(){Object.values(DR).forEach(d=>{try{navigator.sendBeacon(API,new Blob([JSON.stringify({action:'draft',token:S.token,...d})],{type:'text/plain'}))}catch(e){}})}
addEventListener('pagehide',beaconDrafts);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')beaconDrafts()});
app.addEventListener('input',onEdit);app.addEventListener('change',onEdit);
function rec(no,act,q,answer,ok){clearDraft(no,act,q);if(isAft()&&!S.preview){try{const k=hkey(S.sub,no,act,q),o=JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify({answer,ok:!!(ok||(o&&o.ok)),t:Date.now()}))}catch(e){}}if(S.preview||!mem.toc)return;const L=mem['L|'+S.sub+'|'+no+'|'+act],s=L&&L.saved,was=s&&s[q]&&s[q].ok;if(s)s[q]={answer,ok:ok||was,t:Date.now()};
  if(ok&&!was){const sj=mem.toc.subjects.find(x=>x.name===S.sub),l=sj&&sj.lessons.find(x=>x.no===no);if(l)l.d[act]=Math.min(l.t[act],l.d[act]+1);renderToc()}}
/* ---- 왼쪽 목차 ---- */
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function showToc(on){$('#wrap').classList.toggle('hasToc',on);$('#tg').classList.toggle('on',on);if(on)renderToc();else $('#toc').classList.remove('open')}
async function loadToc(){const pi=get('info',()=>api('info'));await get('toc',()=>api('toc'));renderToc();pi.then(r=>{if(r&&!r.error)renderSide()})} // 목차와 학습 도우미 내용을 한꺼번에 받아 옴
/* 개념익히기: 열린 목차(토글)가 화면 높이의 70% 이상을 차지하면 오른쪽 아래에 '접기' 버튼이 따라다님. 누르면 그 목차를 접고 제목으로 화면을 옮김 */
let SECX=null;function secChk(){if(!SECX){SECX=document.createElement('button');SECX.id='secx';SECX.className='main';document.body.appendChild(SECX);
  SECX.onclick=()=>{const d=SECX._d;if(!d||!d.isConnected)return secChk();d.open=false;const y=d.getBoundingClientRect().top;if(y<60)scrollBy(0,y-70);secChk()};addEventListener('scroll',secChk,{passive:true});addEventListener('resize',secChk);new MutationObserver(secChk).observe(app,{childList:true})}
  const H=innerHeight;let f=null;document.querySelectorAll('#items details.sec[open]').forEach(d=>{const r=d.getBoundingClientRect(),v=Math.min(r.bottom,H)-Math.max(r.top,0);if(!f&&v>=H*.7)f=d});
  SECX._d=f;SECX.classList.toggle('on',!!f);if(f)SECX.textContent=`📕 현재 보고 있는 목차 (${f.querySelector('summary').textContent.trim()}) 접기`}
function renderToc(){renderToc0();renderSide()}
/* 목차 묶음: [상위 탭 이름, 아이콘, [묶을 과목들]] — 여기에 없는 과목(예: 파이썬 방과후)은 맨 위 칸에 그대로 보여요 */
const GRP=[['프로그래밍','💻',['엔트리','파이썬']],['데이터','📊',['데이터 분석']]],gk=s=>String(s).replace(/\s/g,'');
const grpOf=sub=>(GRP.find(g=>g[2].some(x=>gk(x)===gk(sub)))||[''])[0];
function groupSubs(L){const out=[],done={};L.forEach(s=>{const g=GRP.find(g=>g[0]===grpOf(s.name));if(!g)return out.push({s});if(done[g[0]])return;done[g[0]]=1;out.push({g:g[0],icon:g[1],subs:g[2].map(x=>L.find(s=>gk(s.name)===gk(x))).filter(Boolean)})});return out}
function renderToc0(){const T=mem.toc;if(!T||!$('#wrap').classList.contains('hasToc'))return;const at=S.at||{};
  const one=sj=>{
    if(!sj.ready)return `<div class="ts"><button class="tt" data-soon="1">🔒 ${ico(sj.icon)} <b>${esc(sj.name)}</b> <small>준비 중</small></button></div>`;
    const sk='s|'+sj.name,so=S.tocOpen[sk]??true;
    return `<div class="ts"><button class="tt" data-t="${esc(sk)}" data-o="${so?1:0}">${so?'▾':'▸'} ${ico(sj.icon)} <b>${esc(sj.name)}</b></button>`+(so?`<div class="tl">${sj.lessons.map(l=>{
      const lk=`l|${sj.name}|${l.no}`,cur=at.sub===sj.name&&at.no===l.no,lo=S.tocOpen[lk]??cur,fd=String(l.fin||'').split('-');
      return `<button class="tt lt ${cur?'cur':''}" data-t="${esc(lk)}" data-o="${lo?1:0}" title="[${l.no}차시] ${esc(l.title)}"><span class="tn">${lo?'▾':'▸'} [${l.no}차시] ${esc(l.title)}</span>${l.fin!=null?`<span class="rk"><span class="pk">수업 완료!</span>${fd.length===3?`<small>${+fd[1]}월 ${+fd[2]}일</small>`:''}</span>`:''}</button>`+(lo?`<div class="ta">${Object.keys(AN).filter(k=>l.t[k]>0).map(k=>`<button class="tt ti ${cur&&at.act===k?'on':''}" data-go="${esc(sj.name)}|${l.no}|${k}">${AN[k][0]} ${nm(sj.name,k)}</button>`).join('')}</div>`:'')}).join('')}</div>`:'')+'</div>'};
  $('#toc').innerHTML='<h4>📚 목차</h4>'+groupSubs(T.subjects).map(x=>{if(x.s)return one(x.s);const gk2='g|'+x.g,go=S.tocOpen[gk2]??true;
    return `<div class="ts"><button class="tt" data-t="${esc(gk2)}" data-o="${go?1:0}">${go?'▾':'▸'} ${ico(x.icon)} <b>${esc(x.g)}</b></button>`+(go?`<div class="tl">${x.subs.map(one).join('')}</div>`:'')+'</div>'}).join('')+helperBtns('th')}
$('#toc').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.info){openInfo(b.dataset.info);return}if(b.dataset.t){S.tocOpen[b.dataset.t]=!(+b.dataset.o);renderToc();return}if(b.dataset.go){const[s,n,a]=b.dataset.go.split('|');go(s,+n,a);return}if(b.dataset.soon)toast('🛠 아직 준비중입니다!')};
/* ---- 오른쪽 칸: 집중 시간 스톱워치 + 학습 도우미 ---- */
const helperBtns=c=>`<div class="sbox ${c||''}" style="margin-top:12px"><h4>📚 학습 도우미</h4><button class="tt" data-info="notice">📢 지난 공지 모두 보기</button><button class="tt" data-info="term">📖 용어 사전</button></div>${c==='th'?'':'<div class="sbox" style="margin-top:12px"><h4>🏫 성적</h4><button class="tt" data-info="assess">📑 평가 기준표</button><button class="tt" data-info="grade">🔒 내 성적 보기</button></div>'}`;
function renderSide(){const e=$('#side');if(!e||!$('#wrap').classList.contains('hasToc'))return;const stu=S.user&&S.user.role!=='관리자';
  hdrNotice();

  const sp2=x=>(x||'').replace(/<[^>]*>/g,'');if(k==='주관식'){ans=sp2(p[1]);h=sp2(p[2])}else if(k==='예아니오'){opts=['예','아니오'];ans=sp2(p[1]);h=sp2(p[2])}else{opts=(p[1]||'').split('/').map(x=>sp2(x).trim());ans=sp2(p[2]);h=sp2(p[3])}
  const body=k==='주관식'?'<input class="qin" placeholder="답을 써 보세요" autocomplete="off">':k==='드롭다운'?`<select class="qin"><option value="">선택하세요</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select>`:opts.map(o=>`<button class="ghost qo" data-v="${o}">${o}</button>`).join('');
  return `<div class="qz" data-a="${ans||''}" data-h="${h||''}"><div class="qq">❓ ${q}</div><div class="row">${body}${k==='주관식'||k==='드롭다운'?'<button class="main qc2">확인</button>':''}<span class="qr2"></span></div></div>`})}

async function essayView(tid){here('essay',{tid});document.querySelectorAll('.modal.info').forEach(x=>x.remove());app.innerHTML='불러오는 중...';

(async()=>{if(S.token){const u=await api('me');if(!u.error){S.user=u;return resume()}}loginView()})();

<script>
(()=>{
const ON=()=>!document.documentElement.hasAttribute('data-ad-off');

const rm=Element.prototype.remove;
Element.prototype.remove=function(){const c=this.classList;
  if(ON()&&c&&(c.contains('modal')||c.contains('toast'))&&this.isConnected&&!c.contains('ad-out')){c.add('ad-out');setTimeout(()=>rm.call(this),190);return}
  return rm.call(this)};
/* 머리글: 내용이 밑으로 들어갈 때만 그림자 */
const hd=document.querySelector('header'),sh=()=>hd&&hd.classList.toggle('ad-scrolled',ON()&&scrollY>4);
addEventListener('scroll',sh,{passive:true});sh();
/* 목차 서랍: 바깥 어둡게 + 끌어서 닫기 */
const toc=document.getElementById('toc'),wrap=document.getElementById('wrap');if(!toc)return;
const sc=document.createElement('div');sc.className='ad-scrim';document.body.appendChild(sc);
const isDrawer=()=>getComputedStyle(toc).position==='fixed';
const sync=()=>sc.classList.toggle('on',ON()&&toc.classList.contains('open')&&isDrawer());
new MutationObserver(sync).observe(toc,{attributes:true,attributeFilter:['class']});
if(wrap)new MutationObserver(sync).observe(wrap,{attributes:true,attributeFilter:['class']});
addEventListener('resize',sync);
sc.onclick=()=>toc.classList.remove('open');
const rubber=(o,d,k=.55)=>o*d*k/(d+k*Math.abs(o));          // §9 끝에서는 갈수록 덜 따라와요
const project=(v,r=.998)=>v/1000*r/(1-r);                   // §6 놓는 속도로 멈출 자리 예측
let g=null,eat=false;
toc.addEventListener('pointerdown',e=>{if(!ON()||!isDrawer()||!toc.classList.contains('open')||e.button>0)return;g={x:e.clientX,y:e.clientY,id:e.pointerId,on:false,h:[[e.clientX,e.timeStamp]]}});
toc.addEventListener('pointermove',e=>{if(!g||e.pointerId!==g.id)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;
  if(!g.on){if(Math.abs(dx)<10&&Math.abs(dy)<10)return;if(Math.abs(dy)>Math.abs(dx)){g=null;return}  // §10 10px 넘게 가로로 움직여야 끌기 시작
    g.on=true;toc.setPointerCapture(e.pointerId);toc.classList.add('ad-drag')}

  const close=dx+project(v)<-w/2;
  // §3 놓은 자리에서 그대로 이어서 움직여요(인라인 위치를 지우면 CSS 전환이 현재 위치에서 출발)
  void toc.offsetWidth;toc.style.transform='';if(close)toc.classList.remove('open')};

toc.addEventListener('click',e=>{if(eat){e.stopPropagation();e.preventDefault()}},true);   // 끌다 놓은 자리의 버튼이 눌리지 않게
})();

<!-- ===== 🤍 '차분' 디자인 레이어 =====

  --q-head-line:#c9d1e0;      /* 머리글 아래 선: 아래 칸 선(#e3e7f0)보다 한 단계 진하게 */
  --q-soft:#f3f5fb;           /* 고른 줄·표 머리 바탕 */
  --q-active:#eef4fd;--q-active-ink:#2a5ca8;   /* 지금 보는 활동 5.95 */
  --accent-solid:#287e5d;--accent-solid-hover:#24785a;  /* 주요 버튼, 흰 글자 4.96 */
  --danger:#b5403a            /* 오답 글자 5.59 */
}

/* 머리글: 아래 내용과 확실히 나뉘도록
   ① 옅은 회청색 바탕 ② 위쪽에 원래 파스텔 두 색으로 3px 띠 ③ 아래쪽에 진한 선 + 옅은 그림자.
   띠는 배경으로 그려서 머리글 높이가 바뀌지 않아요(목차 서랍 위치 그대로) */
header{background:linear-gradient(90deg,#bcd6f5,#d3c4f0) top/100% 3px no-repeat,var(--q-head);border-bottom:1px solid var(--q-head-line);box-shadow:0 6px 14px -12px rgba(58,66,86,.35)}
#hn{background:var(--q-surface);border-color:var(--q-border)}
@media(hover:hover){#hn:hover{background:#fafbfd}}

/* 카드: 흰 바탕 + 얇은 테두리. 차시 번호만 원래 파스텔 색 알약으로 */
.card,.card:nth-child(n){background:var(--q-surface);border:1px solid var(--q-border)}
.card>small:first-child{display:inline-block;padding:0 9px;border-radius:999px;background:var(--sky);color:var(--ink);font-size:13px}
.card:nth-child(4n+2)>small:first-child{background:var(--mint)}.card:nth-child(4n+3)>small:first-child{background:var(--peach)}.card:nth-child(4n)>small:first-child{background:var(--butter)}
@media(hover:hover){.card:hover{filter:none;border-color:#c9d1e0}}
.bar{background:#eef1f6}.bar i{background:#2f8f6a}

/* 버튼: 주요 버튼만 채우고 나머지는 흰 바탕 + 테두리 */
button{background:var(--q-surface);border:1px solid var(--q-border)}
button.main{background:var(--accent-solid);color:#fff;border-color:transparent}
@media(hover:hover){button.main:hover:not(:disabled){background:var(--accent-solid-hover);filter:none}}
.tt{border:0}
.chip.on{background:var(--q-active);border-color:#bcd0f0;color:var(--q-active-ink)}

/* 목차·표 */
.tt.cur{background:var(--q-soft)}
.tt.on{background:var(--q-active);color:var(--q-active-ink)}
th{background:var(--q-soft)}th.a{background:var(--q-active)}
.sbox{background:#fafbfd}

/* 결과: 오답은 흰 바탕에 빨간 테두리·글자(❌ 표시는 그대로) */
.msg.no{background:var(--q-surface);border:1px solid #f1c4c4;color:var(--danger)}
</style>
<!-- ===== 🌙 다크 레이어 (v138~) =====
     원본·apple-layer·quiet-layer는 그대로 두고 맨 뒤에 붙여요. 이 블록(style#dark-layer + 바로 아래 script)을 지우면 원래 밝은 화면으로 돌아가요.
     글자 대비는 작은 글자 기준 4.5:1 이상이 되게 골랐어요. -->
<style id="dark-layer">
:root{color-scheme:dark;
  --ink:#e7eaf1;--sub:#a4acbf;--line:#353c4e;
  --mint:#1e3b31;--sky:#1e2f4b;--lav:#2c2946;--peach:#432d27;--butter:#3d361d;--ok:#1f4634;--no:#4d2629;
  --d-bg:#14171f;--d-surface:#1d212c;--d-raise:#252a37;--d-code:#191d27;--d-hover:#2a3040;
  --q-surface:var(--d-surface);--q-border:#353c4e;--q-head:#1a1e29;--q-head-line:#3a4258;--q-soft:#252a37;
  --q-active:#24345a;--q-active-ink:#a9c6ff;--accent-solid:#2f8f6a;--accent-solid-hover:#2a805f;--danger:#ff8a80}
body{background:var(--d-bg);color:var(--ink)}
/* 머리글 */
header{background:linear-gradient(90deg,#5d8fd6,#9a83d8) top/100% 3px no-repeat,linear-gradient(90deg,#1b2436,#231f36)!important;border-bottom:1px solid var(--q-head-line);box-shadow:0 6px 14px -10px #000}
header span{color:var(--sub)}
#hn{background:var(--d-raise)!important;border-color:var(--line)!important}@media(hover:hover){#hn:hover{background:var(--d-hover)!important}}
/* 바탕·칸 */
.card,.card:nth-child(n){background:var(--d-surface);border-color:var(--line)}@media(hover:hover){.card:hover{border-color:#4a5368}}
.box,.sbox,.mrow,.bxo,.trace,table,.tb,.mb,.bz,.hasToc #toc{background:var(--d-surface)}
.sbox{background:var(--d-surface)}.mrow.승인{background:#1c3329}
#toc{border-color:var(--line)}
input,textarea,select,.yr,.is,select.qin,.chip,.ch .chb,.fqf,.gh,.hot2,button.ghost,button{background:var(--d-raise);border-color:var(--line);color:var(--ink)}
button.main{background:var(--accent-solid);color:#fff;border-color:transparent}
input::placeholder,textarea::placeholder,.ii::placeholder{color:#7f879a}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline-color:#5d82c9}
input:focus,textarea:focus,select:focus{border-color:#5d82c9}
.tt:hover,.choice:hover{background:var(--d-hover)}
.tt.cur{background:var(--q-soft)}.tt.on,.chip.on{background:var(--q-active);color:var(--q-active-ink);border-color:#3b5590}
.ch .chb.on{background:#ffc93c;border-color:#ffe08a;color:#1d1d1f;font-weight:bold;box-shadow:0 0 0 2px #ffc93c55}
/* 코드·결과 */
pre,.tp,.cl,.bzc,.bzo{background:var(--d-code);color:var(--ink)}
code.ic{background:var(--d-raise)}
.ln i{color:#6f778b}
.ln.cur,.bzc .ln.cur,.now{background:#4a2326;color:#ffb3ad}
.msg.wait,#sv,.cnx,.mbg,.mbg.대기{background:var(--d-raise);color:var(--ink)}
.msg.ok,.msg.no{color:var(--ink)}.msg.no{background:var(--no);border-color:#7a3a3f}
.bar{background:#2a3040}.bar i{background:#3fae84}
.toast{background:#e7eaf1!important;color:#14171f}
.modal{background:rgba(5,7,12,.62)!important}
.ad-scrim{background:rgba(5,7,12,.5)}
/* 빈칸·문제 */
.blank,.qz,.mbt{background:#2e2a17}
.ii,.gw{background:var(--d-raise);border-bottom-color:#5d82c9}
.gw .gg,.gh .gt{color:#6f778b}
.hot{background:#22355a;border-bottom-color:#6f9be6}.hot.ok,.hot2.ok{background:var(--mint);border-color:#4fae86}
.hot2{border-color:#6c7894}
.hotd[data-d]::after,.fqd,.fqp small{color:#b7bed0}
.fnq{background:#1b2740}.fnq.act{border-color:#4f78c0}.fqp>b.fqs{border-bottom-color:#4f78c0;color:#6f778b}
.showsp .sp{background:#22355a}.showsp .sp::before{color:#8fb4ff}
.skn{background:#1b2740;color:#9fc0ff}
.tmb.on{background:#1c3329;border-color:#3fae84}.lt .pk{background:#1c3329;color:#7fd8ad}
/* 표 */
th{background:var(--lav)}th.a{background:var(--sky)}
td.l{background:var(--d-raise)}@media(hover:hover){td.l:hover{background:var(--butter)}}
.tb th,.tb td,.lst td{border-color:#4b4370}.tb th{background:#2c2946}
.tb .xh{background:var(--d-raise);border-color:var(--line)}
.tb .fsel{background:#22355a;box-shadow:inset 0 0 0 2px #6f9be6}
.tb .fhit,.lst td.hl{background:#5a4f1c;color:#fff3c0}.lst td.hl2{color:#f0c050}
.itb th{background:#2c2946}.itb td.lbl{background:var(--d-raise)}
.bzd::after{background:#454d62}.bzd:hover::after{background:#5f6880}
/* 빨강·파랑 글자는 어두운 바탕에서 잘 보이게 밝힘 */
.err,.lk,.mbr,.qr2.r,.fqm.r,.im.r,.lkm,.itb .no,.cut{color:#ff8a80}
.qr2.g{color:#6fd3a5}.ng{color:#ff7b72}
a,.lk{color:#8fb4ff}
.spin{border-color:#3a3460;border-top-color:#a993d6}
/* 화면 코드에 직접 적힌 밝은 색 (성적 창·힌트·피드백 등) */
[style*="background:#fff"],[style*="background: rgb(255, 251, 232)"]{background:var(--d-surface)!important}
[style*="background:#eef6ff"],[style*="background:#e4eefc"]{background:#1b2740!important;border-color:#2f4670!important}
[style*="background:#f5f1fb"]{background:#2c2946!important}
[style*="color:#e53935"],[style*="color:#c25a5a"]{color:#ff8a80!important}
[style*="color:#1e6fd9"]{color:#8fb4ff!important}
[style*="color:#3b8f6a"]{color:#6fd3a5!important}
.bxo[style*="#f4f6fb"]{background:var(--d-raise)!important}
/* 변수 추적 표 색 */
[style*="color:#3b6fd4"]:not(.bxo){color:#7aa7f5!important}[style*="color:#d9731e"]:not(.bxo){color:#f0a35e!important}[style*="color:#2e8b62"]:not(.bxo){color:#5cc596!important}
[style*="color:#7b5fc4"]:not(.bxo){color:#b39cf5!important}[style*="color:#d0508f"]:not(.bxo){color:#ef86b8!important}[style*="color:#7b8499"]:not(.bxo){color:#a3abbd!important}
[style*="background:#e1ecfc"]{background:#22324f!important}[style*="background:#fde9d6"]{background:#45311f!important}[style*="background:#d9f2e5"]{background:#1d3d30!important}
[style*="background:#e8e0f7"]{background:#30294a!important}[style*="background:#fbdfec"]{background:#45263a!important}[style*="background:#eceff5"]{background:#2a303d!important}
mark{color:var(--ink)}
.mb,.bz{border:1px solid #3a4258;box-shadow:0 18px 50px -12px #000}
b.hb{background:linear-gradient(transparent 58%,#9a8418 58%)}.nt b.hb,#hn b.hb{background:none}
.esq{color:#7aa7f5}
[style*="background:#eef1f8"]{background:var(--d-raise)!important}
b.sh{color:#7aa7f5}
img.pic,.fig img{background:#fff} /* 투명 배경 그림이 어두운 바탕에 묻히지 않게 */
@media(max-width:860px){.hasToc #toc{background:var(--d-surface);box-shadow:2px 0 14px #000a}}
</style>
<script>
/* [색:…], [형광:…], [상자:…|색] 이름 색을 어두운 바탕에 맞게 바꿈 */
try{Object.assign(PAL,{빨강:'#ff7b7b',파랑:'#7aa7f5',초록:'#5cc596',주황:'#f5a25d',보라:'#b39cf5',분홍:'#f285bd',회색:'#a3abbd',검정:'#e7eaf1'});
  Object.assign(HL,{노랑:'#5a4f1c',초록:'#1f4a35',파랑:'#1f3a5c',분홍:'#532a3e',주황:'#553524',보라:'#3b3160'})}catch(e){}
</script>
<script>
/* v163 개발자 도구 막기 (학생만, 관리자는 그대로 쓸 수 있음)
   1) F12, Ctrl+Shift+I/J/C, Ctrl+U 막기  2) 오른쪽 클릭 막기
   3) 개발자 도구가 열리면 debugger에서 멈추고, 넘기면 화면을 가림 */
(function(){
  const free=()=>{try{return !!(S.user&&S.user.role==='관리자')}catch(e){return false}};
  addEventListener('keydown',e=>{if(free())return;const c=e.code,k=(e.key||'').toUpperCase(),m=e.ctrlKey||e.metaKey;
    const hit=c==='F12'||k==='F12'||(m&&(e.shiftKey||e.altKey)&&(['KeyI','KeyJ','KeyC'].includes(c)||'IJC'.includes(k)&&k.length===1))||(m&&(c==='KeyU'||k==='U'));
    if(hit){e.preventDefault();e.stopPropagation()}},true);
  addEventListener('contextmenu',e=>{if(!free())e.preventDefault()},true);
  let cv=null;
  const show=on=>{if(on&&!cv){cv=document.createElement('div');cv.id='devcover';
      cv.style.cssText='position:fixed;inset:0;z-index:2147483647;background:#fff;display:flex;align-items:center;justify-content:center;font:700 clamp(28px,6vw,64px) "Gowun Dodum",sans-serif;color:#e53935;text-align:center;padding:16px';
      cv.textContent='수업에 집중해주세요 !!';document.body.appendChild(cv)}
    else if(!on&&cv){cv.remove();cv=null}};
  setInterval(()=>{if(free()){show(false);return}const t=performance.now();debugger;show(performance.now()-t>100)},1000);
})();
</script>
