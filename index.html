<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌠%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a4256;--sub:#7b8499;--line:#e8ebf3;--mint:#d4f1e4;--sky:#d6e8fb;--lav:#e5dcf6;--peach:#fde3d6;--butter:#fff3c6;--ok:#bfe8d2;--no:#f9d0d0}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.7 'Gowun Dodum','Malgun Gothic',sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 22px;background:linear-gradient(90deg,var(--sky),var(--lav));position:sticky;top:0;z-index:5}

h2{margin:6px 0 18px}h3{margin:0 0 6px}
button,input,textarea{font:inherit;color:inherit}
button{border:0;border-radius:12px;padding:9px 18px;background:var(--lav);cursor:pointer}
button:hover{filter:brightness(.96)}button.main{background:var(--mint)}button.ghost{background:#fff;border:1px solid var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b9cdf5;outline-offset:2px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{border-radius:18px;padding:18px 20px;background:var(--sky);cursor:pointer;text-align:left;border:0;width:100%;display:block}

.card small{color:var(--sub);display:block}
.bar{height:7px;border-radius:5px;background:#ffffffa0;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:#7fc8a9}

.narrow{max-width:360px;margin:50px auto;text-align:center}.narrow input{margin:6px 0}
pre{background:#f6f7fb;border-radius:12px;padding:12px 14px;overflow:auto;font:14px/1.6 Consolas,monospace;margin:8px 0;white-space:pre-wrap}
.msg{margin-top:8px;padding:8px 12px;border-radius:10px;display:none}.msg.ok{background:var(--ok);display:block}.msg.no{background:var(--no);display:block}
.msg.wait{background:#eef1f8;display:block}.chip{padding:6px 14px;background:#fff;border:1px solid var(--line)}.chip.on{background:var(--sky)}
.bc{line-height:2.2}.blank{display:inline-block;width:min(24em,70vw);padding:2px 8px;margin:0 4px;font:14px/1.6 'Gowun Dodum','Malgun Gothic',sans-serif;background:#fffbe8}

.pic{max-width:100%;border-radius:12px;margin:8px 0;display:block}

.tr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.tr2{grid-template-columns:1fr}}
.tp{background:#f6f7fb;border-radius:12px;padding:8px 0;overflow:auto;font:14px/1.8 Consolas,monospace}.tp h4{margin:0 12px 4px;font:13px 'Gowun Dodum','Malgun Gothic',sans-serif;color:var(--sub)}
.ln{white-space:pre;padding:0 12px 0 36px;position:relative;min-height:1.8em}.ln i{position:absolute;left:6px;color:#b5bbcb;font-style:normal;font-size:12px}
.ln.cur{background:#ffe0e0;color:#c0392b;font-weight:bold}.ln.cur::after{content:'▶';position:absolute;left:22px;font-size:10px}
.hot{border-bottom:2px dotted #6a8fd8;background:#e4eefc;border-radius:4px;padding:0 3px;cursor:pointer}
.hot2{display:inline-block;vertical-align:top;white-space:pre-wrap;border:1px dashed #9aa6c4;background:#fff;border-radius:6px;padding:0 5px;cursor:pointer}.hot2.ok{border-style:solid;border-color:#7fc8a9;background:var(--mint)}
.vtb{margin-top:10px;width:100%}.vtb td,.vtb th{text-align:left}.vtb tr.chg td{background:var(--butter);font-weight:bold}
.modal{position:fixed;inset:0;background:#3a425660;display:flex;align-items:center;justify-content:center;z-index:30}.mb{background:#fff;border-radius:18px;padding:22px;max-width:440px;width:90%}
.bk{width:5.5em;display:inline-block;padding:2px 8px;margin:0 4px}
.cut{color:#e05a5a;text-decoration:line-through;text-decoration-thickness:2px;opacity:.75}.now{background:#ffe0e0;color:#c0392b;border-radius:4px;padding:0 3px}
.sp{display:inline-block;position:relative}.showsp .sp::before{content:'·';position:absolute;left:0;right:0;text-align:center;color:#3b6fd4;font-weight:bold}.showsp .sp{background:#eaf1ff}
button:disabled{opacity:.5;cursor:not-allowed}
#wrap.hasToc{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:none;margin:0}.hasToc main{margin:0;max-width:1000px;padding-left:22px}
#side{display:none;position:sticky;top:58px;align-self:start;padding:18px 16px;max-height:calc(100vh - 58px);overflow:auto}
@media(min-width:1200px){#wrap.hasToc{grid-template-columns:250px minmax(0,1fr) 300px}.hasToc #side{display:block}}
.sbox{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}.sbox h4{margin:0 0 6px;font-size:14px;color:var(--sub)}
.yr{padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;width:auto}
#toc{display:none}.hasToc #toc{display:block;position:sticky;top:58px;align-self:start;max-height:calc(100vh - 58px);overflow:auto;padding:18px 8px 60px 10px;border-right:1px solid var(--line)}
#toc h4{margin:0 0 10px;font:14px 'Gowun Dodum','Malgun Gothic',sans-serif;color:var(--sub)}
.tt{display:block;width:100%;text-align:left;background:none;padding:6px 8px;border-radius:10px;font-size:15px;line-height:1.4}.tt:hover{background:#f3f5fb}.tt small{color:var(--sub);margin-left:4px}
.tt.cur{background:var(--butter)}.tt.on{background:var(--sky);font-weight:bold}.tl{margin-left:10px}.ta{margin-left:16px}.ti{font-size:14px}
#tg{display:none}#tg.on{display:inline-block}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#3a4256;color:#fff;padding:10px 18px;border-radius:12px;z-index:50}
#sv{position:fixed;right:16px;bottom:16px;padding:6px 12px;border-radius:10px;background:#eef1f8;font-size:13px;display:none;z-index:40}#sv.ok{background:var(--ok)}#sv.bad{background:var(--no)}
@media(max-width:860px){#wrap.hasToc{display:block}.hasToc #toc{position:fixed;left:0;top:56px;bottom:0;max-height:none;width:290px;background:#fff;z-index:15;transform:translateX(-105%);transition:transform .2s;box-shadow:2px 0 12px #0002}.hasToc #toc.open{transform:none}}
@media(min-width:861px){#tg{display:none!important}}
.lk{margin:10px 0 0;color:#c25a5a;font-size:14px}.lw.locked{opacity:.45}.lw.locked .pv,.lw.locked .nx,.lw.locked .ap,.lw.locked .sl{pointer-events:none}
.fig{margin:8px 0}.fig figcaption{color:var(--sub);font-size:14px;text-align:center;margin-top:4px}.cols{display:grid;gap:16px;margin:10px 0}.col{min-width:0}
@media(max-width:640px){.cols{grid-template-columns:1fr!important}}
.qz{background:#fffbe8;border-radius:14px;padding:12px 14px;margin:10px 0}.qq{font-weight:bold;margin-bottom:6px}.qin{max-width:260px}select.qin{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;width:auto}
.qr2{font-weight:bold}.qr2.g{color:#2e8b62}.qr2.r{color:#c25a5a}.qo.sel{background:var(--sky)}
code.ic{background:#f1f3fa;border-radius:6px;padding:0 5px;font:.92em Consolas,monospace}
.ii{display:inline-block;width:auto;min-width:6em;padding:2px 8px;margin:0 4px;border:0;border-bottom:2px solid #b9cdf5;border-radius:6px;background:#fbfcff}.ii::placeholder{color:#b9bfce}
.is{padding:2px 8px;margin:0 4px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;width:auto}.im{font-weight:bold}.im.g{color:#2e8b62}.im.r{color:#c25a5a}
.ck{display:inline-flex;align-items:center;gap:6px;margin:2px 14px 2px 0;cursor:pointer}.ck input{width:auto}
details.sec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}details.sec>summary::-webkit-details-marker{display:none}details.sec>summary h3{margin:0}
details.sec>summary::before{content:'▾';color:var(--sub)}details.sec:not([open])>summary::before{content:'▸'}details.sec[open]>summary{margin-bottom:10px}
.cols2{display:grid;gap:4px 16px;margin:10px 0;align-items:center}.cell{min-width:0;min-height:1.7em}
.clk{font:700 30px/1.2 Consolas,monospace;letter-spacing:1px}.tmb.on{border-color:#7fc8a9;background:#f3fbf7}.tmc{display:none;font-size:13px}
@media(max-width:1199px){.tmc.on{display:inline-block}}@media(min-width:1200px){.th{display:none}}
.err{color:#c25a5a;min-height:24px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.choice{display:block;padding:6px 10px;border-radius:10px;cursor:pointer}.choice:hover{background:#f3f5fb}.choice input{width:auto;margin-right:8px}
table{border-collapse:collapse;font-size:14px;background:#fff}th,td{border:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
th{background:var(--lav)}th.a{background:var(--sky)}td.l{text-align:left;cursor:pointer;background:#fafbff}td.l:hover{background:var(--butter)}
td.done{background:var(--ok)}tfoot td{background:var(--butter);font-weight:bold}
.wrap{overflow-x:auto;border-radius:12px}
</style></head><body>
<header><button class="ghost" id="tg" onclick="$('#toc').classList.toggle('open')">☰ 목차</button><b>🌠 혜성쌤과 함께하는 정보 수업</b><span>배곧해솔중학교 (v41)</span><span id="tm" class="tmc"></span><div id="who"></div></header>
<div id="wrap"><aside id="toc"></aside><main id="app"></main><aside id="side"></aside></div><div id="sv"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxOs6iZJsaQQyUNiQMouiCGJnRh0-4vbh2fQ2OrtqwJEXEORIKD9rbPJMZKaDiMeAvF/exec';
const $=s=>document.querySelector(s),app=$('#app');
const S={token:sessionStorage.getItem('t')||'',user:null,menu:null,preview:false,sel:{},sub:'',asub:'',at:null,tocOpen:{},ayear:''};let mem={};
const memT={};async function get(k,fn,force){if(!force&&mem[k]&&Date.now()-(memT[k]||0)<60000)return mem[k];const r=await fn();if(!r.error){mem[k]=r;memT[k]=Date.now()}return r}
/* ---- 임시저장(입력 중인 답 자동 저장) ---- */
const DR={};let dtm=null,dretry=null;
const dkey=(s,n,a,q)=>`hd|${S.user?S.user.id:''}|${s}|${n}|${a}|${q}`;
function clearDraft(no,act,q){const k=dkey(S.sub,no,act,q);delete DR[k];try{localStorage.removeItem(k)}catch(e){}}
function loadLocal(q){try{const a=S.at;return a&&a.act?JSON.parse(localStorage.getItem(dkey(a.sub,a.no,a.act,q))||'null'):null}catch(e){return null}}
function setSv(t,c){const e=$('#sv');e.textContent=t;e.className=c||'';e.style.display='block';clearTimeout(setSv.h);if(c==='ok')setSv.h=setTimeout(()=>e.style.display='none',2500)}
function collect(bx){if(bx.dataset.etc)return [...bx.querySelectorAll('.ib')].map((x,k)=>`${k+1}: ${x.type==='checkbox'?(x.checked?'1':'0'):x.value}`).join('\n');const bl=[...bx.querySelectorAll('.blank')];if(bl.length)return bl.map((x,k)=>`${k+1}: ${x.value.trim()}`).join('\n');const rd=bx.querySelector('input[type=radio]:checked');if(rd)return rd.value;const el=bx.querySelector('.ans,.free,textarea');return el?el.value:''}
function onEdit(e){const a=S.at;if(S.preview||!a||!a.act||e.target.closest('.trace,.qz'))return;let q,text;
  if(a.act==='개념'){const el=e.target.closest('.ib');if(!el)return;q=+el.dataset.i;text=el.type==='checkbox'?(el.checked?'1':'0'):el.value}
  else{const bx=e.target.closest('.box[data-q]');if(!bx||(e.target.closest('.ib')&&!bx.dataset.etc))return;q=+bx.dataset.q;text=collect(bx)}
  const k=dkey(a.sub,a.no,a.act,q);DR[k]={sub:a.sub,no:a.no,act:a.act,q,text,t:Date.now()};
  try{localStorage.setItem(k,JSON.stringify({t:Date.now(),text}))}catch(_){}
  setSv('✏️ 입력 중...','');clearTimeout(dtm);dtm=setTimeout(flushDrafts,3000)}
async function flushDrafts(){clearTimeout(dretry);const keys=Object.keys(DR);if(!keys.length)return;setSv('💾 저장 중...','');let bad=false;
  for(const k of keys){const d=DR[k];if(!d)continue;const r=await api('draft',{sub:d.sub,no:d.no,act:d.act,q:d.q,text:d.text});if(r.error){if(/저장할 수 없/.test(r.error)){delete DR[k];continue}bad=true;continue}if(DR[k]&&DR[k].t===d.t)delete DR[k]}
  if(bad){setSv('⚠ 저장이 안 됐어요. 연결되면 자동으로 다시 저장해요 (내용은 이 기기에 보관 중)','bad');dretry=setTimeout(flushDrafts,8000)}else setSv('💾 저장됐어요','ok')}
function beaconDrafts(){Object.values(DR).forEach(d=>{try{navigator.sendBeacon(API,new Blob([JSON.stringify({action:'draft',token:S.token,...d})],{type:'text/plain'}))}catch(e){}})}
addEventListener('pagehide',beaconDrafts);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')beaconDrafts()});
app.addEventListener('input',onEdit);app.addEventListener('change',onEdit);
function rec(no,act,q,answer,ok){clearDraft(no,act,q);if(S.preview||!mem.toc)return;const L=mem['L|'+S.sub+'|'+no+'|'+act],s=L&&L.saved,was=s&&s[q]&&s[q].ok;if(s)s[q]={answer,ok:ok||was,t:Date.now()};
  if(ok&&!was){const sj=mem.toc.subjects.find(x=>x.name===S.sub),l=sj&&sj.lessons.find(x=>x.no===no);if(l)l.d[act]=Math.min(l.t[act],l.d[act]+1);renderToc()}}
/* ---- 왼쪽 목차 ---- */
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function showToc(on){$('#wrap').classList.toggle('hasToc',on);$('#tg').classList.toggle('on',on);if(on)renderToc();else $('#toc').classList.remove('open')}
async function loadToc(){await get('toc',()=>api('toc'));renderToc();get('info',()=>api('info')).then(r=>{if(r&&!r.error)renderSide()})}
let NSEEN=false;function autoNotice(){if(NSEEN||!S.user||S.user.role==='관리자'||S.preview)return;const I=mem.info,k='seen|'+S.user.id;let seen=[];try{seen=JSON.parse(localStorage.getItem(k)||'[]')}catch(e){}
  const nw=((I&&I.notices)||[]).filter(x=>!seen.includes(x.date+'|'+x.title));NSEEN=true;if(!nw.length)return;try{localStorage.setItem(k,JSON.stringify(seen.concat(nw.map(x=>x.date+'|'+x.title)).slice(-200)))}catch(e){}openInfo('notice',nw)}
function renderToc(){renderToc0();renderSide()}
function renderToc0(){const T=mem.toc;if(!T||!$('#wrap').classList.contains('hasToc'))return;const at=S.at||{};
  $('#toc').innerHTML='<h4>📚 목차</h4>'+T.subjects.map(sj=>{
    if(!sj.ready)return `<div class="ts"><button class="tt" data-soon="1">🔒 ${ico(sj.icon)} <b>${esc(sj.name)}</b> <small>준비 중</small></button></div>`;
    const sk='s|'+sj.name,so=S.tocOpen[sk]??true;
    return `<div class="ts"><button class="tt" data-t="${esc(sk)}" data-o="${so?1:0}">${so?'▾':'▸'} ${ico(sj.icon)} <b>${esc(sj.name)}</b></button>`+(so?`<div class="tl">${sj.lessons.map(l=>{
      const lk=`l|${sj.name}|${l.no}`,cur=at.sub===sj.name&&at.no===l.no,lo=S.tocOpen[lk]??cur,t=l.t.해석+l.t.작성,d=Math.min(l.t.해석,l.d.해석)+Math.min(l.t.작성,l.d.작성);
      return `<button class="tt ${cur?'cur':''}" data-t="${esc(lk)}" data-o="${lo?1:0}">${lo?'▾':'▸'} [${l.no}차시] ${esc(l.title)}${t?` <small>${d}/${t}</small>`:''}</button>`+(lo?`<div class="ta">${Object.keys(AN).filter(k=>l.t[k]>0).map(k=>`<button class="tt ti ${cur&&at.act===k?'on':''}" data-go="${esc(sj.name)}|${l.no}|${k}">${AN[k][0]} ${nm(sj.name,k)}${k==='개념'?(l.d[k]>0?' ✔':''):` <small>${Math.min(l.d[k],l.t[k])}/${l.t[k]}</small>`}</button>`).join('')}</div>`:'')}).join('')}</div>`:'')+'</div>'}).join('')+helperBtns('th')}
$('#toc').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.info){openInfo(b.dataset.info);return}if(b.dataset.t){S.tocOpen[b.dataset.t]=!(+b.dataset.o);renderToc();return}if(b.dataset.go){const[s,n,a]=b.dataset.go.split('|');go(s,+n,a);return}if(b.dataset.soon)toast('🛠 아직 준비중입니다!')};
/* ---- 오른쪽 칸: 집중 시간 스톱워치 + 학습 도우미 ---- */
const helperBtns=c=>`<div class="sbox ${c||''}" style="margin-top:12px"><h4>📚 학습 도우미</h4><button class="tt" data-info="notice">📢 지난 공지 모두 보기</button><button class="tt" data-info="term">📖 용어 사전</button><button class="tt" data-info="err">🛠 오류 모음</button><button class="tt" data-info="cheat">📝 치트시트</button></div><div class="sbox" style="margin-top:12px"><h4>🏫 성적</h4><button class="tt" data-info="assess">📑 평가 기준표</button><button class="tt" data-info="grade">🔒 내 성적 보기</button></div>`;
function renderSide(){const e=$('#side');if(!e||!$('#wrap').classList.contains('hasToc'))return;const stu=S.user&&S.user.role!=='관리자';
  const I=mem.info,N=(I&&I.notices||[]).slice(0,3),nb=`<div class="sbox" style="background:#fffbe8"><h4>📢 공지</h4>${N.length?N.map(x=>`<div style="margin-bottom:8px"><b>${esc(x.title)}</b> <small style="color:var(--sub)">${esc(x.date)}</small><div style="font-size:14px;max-height:160px;overflow:auto">${fmt(x.body)}</div></div>`).join(''):'<small style="color:var(--sub)">새 공지가 없어요</small>'}</div>`;
  e.innerHTML=nb+(stu?`<div class="sbox tmb" id="tbf"><h4>🎯 오늘 내가 수업에 집중한 시간</h4><div class="clk" id="tf">00:00:00</div></div><div class="sbox tmb" id="tba"><h4>💤 잠시 다른 곳에 다녀온 시간</h4><div class="clk" id="ta">00:00:00</div></div><p style="font-size:12px;color:var(--sub);margin:0 0 12px">이 화면이 보이는 동안 집중 시간이 올라가고, 다른 탭·창으로 가거나 화면을 최소화하면 멈춰요.</p>`:'<div class="sbox"><small>👀 미리보기에서는 시간이 기록되지 않아요</small></div>')+helperBtns();tmUpd()}
$('#side').onclick=e=>{const b=e.target.closest('button[data-info]');if(b)openInfo(b.dataset.info)};
const TM={f:0,a:0,start:0,date:'',last:0,hid:false,dirty:false,on:false,t1:null,t2:null};
const tdy=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const fmtT=s=>{s=Math.max(0,Math.floor(s));const p=n=>String(n).padStart(2,'0');return `${p(Math.floor(s/3600))}:${p(Math.floor(s%3600/60))}:${p(s%60)}`};

function tmUpd(){const f=$('#tf'),a=$('#ta'),c=$('#tm'),b1=$('#tbf'),b2=$('#tba');if(f)f.textContent=fmtT(TM.f);if(a)a.textContent=fmtT(TM.a);if(b1)b1.classList.toggle('on',TM.on&&!TM.hid);if(b2)b2.classList.toggle('on',TM.on&&TM.hid);

async function detailView(id,cls){app.innerHTML='불러오는 중...';const r=await api('detail',{id});if(r.error)return app.innerHTML=r.error;
  const g={};r.recs.forEach(x=>{const k=x.sub+'|'+x.no;(g[k]=g[k]||{sub:x.sub,no:x.no,list:[]}).list.push(x)});const ks=Object.values(g).sort((a,b)=>(b.sub===S.asub)-(a.sub===S.asub)||b.no-a.no);
  app.innerHTML=`<p><button class="ghost" id="b">← ${cls}반 현황</button></p><h2>${esc(r.sid||id)} ${esc(r.name)}</h2><div class="row" style="margin-bottom:14px"><button id="rs">비밀번호 초기화 (학번으로)</button></div>${(r.times&&r.times.length)?`<details class="box"><summary><b>⏱ 수업 집중 시간 (최근 ${r.times.length}일)</b></summary><div class="wrap"><table><thead><tr><th>날짜</th><th>집중</th><th>다른 곳</th></tr></thead><tbody>${r.times.map(x=>`<tr><td>${x.date}</td><td>${fmtT(x.focus)}</td><td>${fmtT(x.away)}</td></tr>`).join('')}</tbody></table></div></details>`:''}`+(ks.map((k,i)=>`<details class="box" ${i===0?'open':''}><summary><b>${esc(k.sub)} · ${k.no}차시</b> · 기록 ${k.list.length}건</summary><div class="wrap"><table><thead><tr><th>활동</th><th>문항</th><th>정답</th><th>시도</th><th>최근 제출</th><th>답안</th></tr></thead><tbody>${k.list.map(x=>`<tr><td>${AN[x.act]?nm(x.sub,x.act):x.act}</td><td>${x.q||'-'}</td><td>${x.free?'✍️ 제출':(x.ok?'⭕':'❌')}</td><td>${x.tries}</td><td>${x.last}</td><td style="text-align:left"><details><summary>보기</summary><pre>${esc(x.answer)}</pre></details></td></tr>`).join('')}</tbody></table></div></details>`).join('')||'<p>아직 기록이 없어요.</p>');
  $('#b').onclick=()=>classView(cls);
  $('#rs').onclick=async()=>{if(!confirm(`${r.name} 학생의 비밀번호를 학번으로 되돌릴까요?`))return;const x=await api('resetPw',{id});alert(x.error||'초기화했어요. 다음 로그인 때 비밀번호를 새로 만들게 됩니다.')}}

/* 시작 */
(async()=>{if(S.token){const u=await api('me');if(!u.error){S.user=u;return start()}}loginView()})();
</script></body></html>
