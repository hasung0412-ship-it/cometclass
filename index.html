<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>배곧해솔중학교 정보</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a4256;--sub:#7b8499;--line:#e8ebf3;--mint:#d4f1e4;--sky:#d6e8fb;--lav:#e5dcf6;--peach:#fde3d6;--butter:#fff3c6;--ok:#bfe8d2;--no:#f9d0d0}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.7 'Gowun Dodum','Malgun Gothic',sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 22px;background:linear-gradient(90deg,var(--sky),var(--lav));position:sticky;top:0;z-index:5}
header b{font-size:20px}header span{color:var(--sub);font-size:14px}#who{margin-left:auto;display:flex;gap:10px;align-items:center}
main{max-width:920px;margin:0 auto;padding:26px 18px 60px}
h2{margin:6px 0 18px}h3{margin:0 0 6px}
button,input,textarea{font:inherit;color:inherit}
button{border:0;border-radius:12px;padding:9px 18px;background:var(--lav);cursor:pointer}
button:hover{filter:brightness(.96)}button.main{background:var(--mint)}button.ghost{background:#fff;border:1px solid var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b9cdf5;outline-offset:2px}
input,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;background:#fff}
textarea{font-family:Consolas,monospace;font-size:14px;min-height:150px;tab-size:4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{border-radius:18px;padding:18px 20px;background:var(--sky);cursor:pointer;text-align:left;border:0;width:100%;display:block}
.card:nth-child(4n+2){background:var(--mint)}.card:nth-child(4n+3){background:var(--peach)}.card:nth-child(4n){background:var(--butter)}
.card small{color:var(--sub);display:block}
.bar{height:7px;border-radius:5px;background:#ffffffa0;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:#7fc8a9}
.box{border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px}
.narrow{max-width:360px;margin:50px auto;text-align:center}.narrow input{margin:6px 0}
pre{background:#f6f7fb;border-radius:12px;padding:12px 14px;overflow:auto;font:14px/1.6 Consolas,monospace;margin:8px 0;white-space:pre-wrap}
.msg{margin-top:8px;padding:8px 12px;border-radius:10px;display:none}.msg.ok{background:var(--ok);display:block}.msg.no{background:var(--no);display:block}
.msg.wait{background:#eef1f8;display:block}.chip{padding:6px 14px;background:#fff;border:1px solid var(--line)}.chip.on{background:var(--sky)}
.bc{line-height:2.2}.blank{display:inline-block;width:min(24em,70vw);padding:2px 8px;margin:0 4px;font:14px/1.6 'Gowun Dodum','Malgun Gothic',sans-serif;background:#fffbe8}
.ico{height:1.3em;vertical-align:-.25em;border-radius:5px}.card .ico{height:48px;display:block;margin-bottom:6px;vertical-align:baseline}
.err{color:#c25a5a;min-height:24px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.choice{display:block;padding:6px 10px;border-radius:10px;cursor:pointer}.choice:hover{background:#f3f5fb}.choice input{width:auto;margin-right:8px}
table{border-collapse:collapse;font-size:14px;background:#fff}th,td{border:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
th{background:var(--lav)}th.a{background:var(--sky)}td.l{text-align:left;cursor:pointer;background:#fafbff}td.l:hover{background:var(--butter)}
td.done{background:var(--ok)}tfoot td{background:var(--butter);font-weight:bold}
.wrap{overflow-x:auto;border-radius:12px}
</style></head><body>
<header><b>🏫 배곧해솔중학교</b><span> 정보 (v7)</span><div id="who"></div></header>
<main id="app"></main>
<script>
const API='https://script.google.com/macros/s/AKfycbye7Geo9oK68GK540J081pBQDDkhQbmlZShl2PByXZiIwILu2dJ5PAVNDsTYtrmKEo2/exec';
const $=s=>document.querySelector(s),app=$('#app');
const S={token:sessionStorage.getItem('t')||'',user:null,menu:null,preview:false,sel:{},sub:'',asub:''};let mem={};
async function get(k,fn,force){if(!force&&mem[k])return mem[k];const r=await fn();if(!r.error)mem[k]=r;return r}
function rec(no,act,q,answer,ok){if(S.preview||!S.menu)return;const L=mem['L|'+S.sub+'|'+no+'|'+act],s=L&&L.saved,was=s&&s[q]&&s[q].ok;if(s)s[q]={answer,ok:ok||was};if(ok&&!was){const l=S.menu.lessons.find(x=>x.no===no);l.d[act]=Math.min(l.t[act],l.d[act]+1)}}
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ico=x=>/^https?:\/\//i.test(String(x))||/\.(png|jpe?g|gif|svg|webp)$/i.test(String(x))?`<img class="ico" src="${esc(x)}" alt="">`:esc(x);
const AN={개념:['📘','개념 학습'],해석:['🔍','코드 해석'],작성:['✍️','코드 작성']};
async function api(action,d={}){
  try{const r=await(await fetch(API,{method:'POST',body:JSON.stringify({action,token:S.token,sub:S.sub,...d})})).json();
    if(r.error==='auth'){logout();return{error:'다시 로그인해 주세요.'}}return r}
  catch(e){return{error:'서버에 연결할 수 없어요. 인터넷과 API 주소를 확인해 주세요.'}}}
function fmt(t){return String(t??'').split('```').map((x,i)=>i%2?`<pre>${esc(x.trim())}</pre>`:esc(x).replace(/\n/g,'<br>')).join('')}
function bar(d,t){return `<div class="bar"><i style="width:${t?Math.min(100,d/t*100):0}%"></i></div>`}
function setWho(){const u=S.user;$('#who').innerHTML=u?`${S.preview?'<span>👀 미리보기 중 (기록 안 됨)</span>':''}<span>${esc(u.name)}</span>`+(u.role==='관리자'?`<button class="ghost" onclick="togglePrev()">${S.preview?'관리자 화면':'학생 화면 보기'}</button>`:'')+`<button class="ghost" onclick="logout()">로그아웃</button>`:''}
function togglePrev(){S.preview=!S.preview;setWho();S.preview?langView():adminView()}
function logout(){mem={};S.preview=false;S.sel={};S.sub='';S.asub='';sessionStorage.removeItem('t');S.token='';S.user=null;setWho();loginView()}

/* 로그인 */
function loginView(msg=''){app.innerHTML=`<div class="box narrow"><h2>로그인</h2>
<input id="id" placeholder="학번" autocomplete="username"><input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
<div class="err" id="e">${esc(msg)}</div><button class="main" id="go">들어가기</button>
<p style="color:var(--sub);font-size:14px">처음 로그인할 때 비밀번호는 학번이에요.</p><p><a href="#" id="fg" style="color:var(--sub);font-size:14px">비밀번호를 잊어버렸어요!</a></p></div>`;
  const go=async()=>{$('#e').textContent='확인 중...';const r=await api('login',{id:$('#id').value,pw:$('#pw').value});
    if(r.error)return $('#e').textContent=r.error;S.token=r.token;sessionStorage.setItem('t',r.token);S.user=r;start()};
  $('#fg').onclick=e=>{e.preventDefault();forgotView()};$('#go').onclick=go;$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')go()})}
function start(){setWho();if(S.user.must)return pwView();S.user.role==='관리자'?adminView():langView()}
function pwView(){app.innerHTML=`<div class="box narrow"><h2>새 비밀번호 만들기</h2><p>처음 로그인했어요. 비밀번호를 바꿔야 계속할 수 있어요.</p>
<input id="n1" type="password" placeholder="새 비밀번호 (4자 이상)"><input id="n2" type="password" placeholder="한 번 더 입력"><div class="err" id="e"></div><button class="main" id="go">바꾸기</button></div>`;
  $('#go').onclick=async()=>{if($('#n1').value!==$('#n2').value)return $('#e').textContent='두 비밀번호가 달라요.';
    const r=await api('changePw',{newPw:$('#n1').value});if(r.error)return $('#e').textContent=r.error;S.user.must=false;start()}}

/* 학생: 언어 → 차시 → 활동 → 내용 */
async function langView(){if(!mem.subjects)app.innerHTML='불러오는 중...';const r=await get('subjects',()=>api('subjects'));if(r.error)return app.innerHTML=r.error;
  app.innerHTML=`<h2>배울 과목을 골라요</h2>`+(r.subjects.length?`<div class="grid">${r.subjects.map((s,i)=>`<button class="card" data-i="${i}">${ico(s.icon)} <b>${esc(s.name)}</b>${s.ready?'':'<small>준비 중</small>'}</button>`).join('')}</div><div class="msg wait" id="soon" style="display:none;margin-top:14px"></div>`:'<p>아직 등록된 과목이 없어요.</p>');
  app.querySelectorAll('[data-i]').forEach(b=>b.onclick=async()=>{const s=r.subjects[+b.dataset.i];if(!s.ready){const r2=await get('subjects',()=>api('subjects'),true),s2=(r2.subjects||[]).find(x=>x.name===s.name);if(s2&&s2.ready){S.sub=s.name;return lessonView()}const m=$('#soon');m.style.display='block';m.textContent='🛠 아직 준비중입니다!';return}S.sub=s.name;lessonView()})}
function forgotView(){app.innerHTML=`<div class="box narrow"><h2>비밀번호 초기화</h2><p style="font-size:14px;color:var(--sub)">선생님께 받은 <b>고유키</b>를 입력하면 비밀번호가 학번으로 초기화돼요. 그다음 로그인하면 새 비밀번호를 만들 수 있어요.</p>
<input id="fi" placeholder="학번"><input id="fk" placeholder="고유키" autocomplete="off"><div class="err" id="e"></div><button class="main" id="go">초기화하기</button> <button class="ghost" id="bk">← 로그인</button><p><a href="#" id="nk" style="color:var(--sub);font-size:14px">고유키도 잊어버렸어요!</a></p></div>`;
  $('#bk').onclick=()=>loginView();
  $('#nk').onclick=e=>{e.preventDefault();alert('니가 만든\n니 계정의\n니 비밀번호도 잊고\n니 고유키도 잊으면\n대체 뭘 하겠다는건가요?\n선생님께 문의 받으세요')};
  $('#go').onclick=async()=>{$('#e').textContent='확인 중...';const r=await api('forgot',{id:$('#fi').value,key:$('#fk').value});if(r.error)return $('#e').textContent=r.error;loginView('✅ 초기화했어요! 학번을 비밀번호로 입력해 로그인하세요.')}}
async function lessonView(){const mk='m|'+S.sub;if(!mem[mk])app.innerHTML='불러오는 중...';const r=await get(mk,()=>api('menu'));if(r.error){app.innerHTML=`<p><button class="ghost" onclick="langView()">← 과목 선택</button></p><p>${esc(r.error)}</p>`;return}S.menu=r;
  app.innerHTML=`<p><button class="ghost" onclick="langView()">← 과목 선택</button></p><h2>${esc(S.sub)} · 차시를 골라요</h2>`+(r.lessons.length?`<div class="grid">${r.lessons.map(l=>{
  const t=l.t.개념+l.t.해석+l.t.작성,d=Math.min(l.t.개념,l.d.개념)+Math.min(l.t.해석,l.d.해석)+Math.min(l.t.작성,l.d.작성);
  return `<button class="card" data-no="${l.no}"><small>${l.no}차시</small><b>${esc(l.title)}</b>${bar(d,t)}</button>`}).join('')}</div>`:'<p>아직 올라온 차시가 없어요.</p>');
  app.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>actView(+b.dataset.no))}
function actView(no){const l=S.menu.lessons.find(x=>x.no===no);
  app.innerHTML=`<p><button class="ghost" onclick="lessonView()">← 차시 선택</button></p><h2>[${no}차시] ${esc(l.title)}</h2><div class="grid">${Object.keys(AN).filter(k=>l.t[k]>0).map(k=>
  `<button class="card" data-k="${k}"><small>${AN[k][0]}</small><b>${AN[k][1]}</b><small>${Math.min(l.d[k],l.t[k])} / ${l.t[k]} 완료</small>${bar(l.d[k],l.t[k])}</button>`).join('')}</div>`;
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>contentView(no,b.dataset.k));Object.keys(AN).filter(k=>l.t[k]>0).forEach(k=>get('L|'+S.sub+'|'+no+'|'+k,()=>api('lesson',{no,act:k})))}
async function contentView(no,act){const lk='L|'+S.sub+'|'+no+'|'+act;if(!mem[lk])app.innerHTML='불러오는 중...';const r=await get(lk,()=>api('lesson',{no,act}));if(r.error)return app.innerHTML=r.error;
  const l=S.menu.lessons.find(x=>x.no===no);
  app.innerHTML=`<p><button class="ghost" id="back">← 활동 선택</button></p><h2>${AN[act][0]} ${AN[act][1]}</h2><div id="items"></div>`;
  $('#back').onclick=()=>actView(no);
  const box=$('#items');
  if(act==='개념'){box.innerHTML=r.items.map(i=>`<div class="box"><h3>${esc(i.title)}</h3>${fmt(i.body)}</div>`).join('')+`<button class="main" id="done">${r.saved[0]?.ok?'✔ 읽었어요 (완료됨)':'다 읽었어요 ✔'}</button>`;
    $('#done').onclick=async()=>{$('#done').textContent='저장 중...';const x=await api('submit',{no,act,q:0,answer:'읽음'});if(x.error){$('#done').textContent='저장 실패, 다시 눌러 주세요';return}rec(no,act,0,'읽음',true);$('#done').textContent='✔ 완료됐어요!'}}
  if(act==='해석'){const isF=i=>i.type==='설명쓰기'||i.type==='서술';
  const cd=(i,v)=>{if(i.type!=='설명쓰기')return i.code?`<pre>${esc(i.code)}</pre>`:'';let k=0;return '<pre class="bc">'+String(i.code||'').split(/(\/\*\s*\??\s*\*\/)/).map((p,x)=>x%2?`<input class="blank" placeholder="이 부분의 의미를 써 보세요" value="${esc(v[k++]||'')}">`:esc(p)).join('')+'</pre>'};
  box.innerHTML=r.items.map((i,n)=>{const s=r.saved[i.q],f=isF(i),v=s&&i.type==='설명쓰기'?String(s.answer).split('\n').map(l=>l.replace(/^\d+:\s?/,'')):[];
    const inp=i.type==='설명쓰기'?'':i.choices?i.choices.map(c=>`<label class="choice"><input type="radio" name="q${i.q}" value="${esc(c)}" ${s&&String(s.answer)===c?'checked':''}>${esc(c)}</label>`).join(''):i.type==='서술'?`<textarea class="free" style="min-height:90px;font-family:inherit" placeholder="생각을 자유롭게 써 보세요">${esc(s?s.answer:'')}</textarea>`:`<input class="ans" placeholder="답을 입력하세요" value="${esc(s?s.answer:'')}">`;
    return `<div class="box" data-q="${i.q}"><h3>문제 ${n+1}</h3>${fmt(i.text)}${cd(i,v)}${inp}<div class="row"><button class="main chk">${f?'제출하기':'정답 확인'}</button></div><div class="msg ${s&&(f||s.ok)?'ok':''}">${s?(f?'📨 이전에 제출했어요 (고쳐서 다시 제출해도 돼요)':(s.ok?'✅ 이전에 맞혔어요':'')):''}</div></div>`}).join('');
  box.querySelectorAll('.chk').forEach(b=>b.onclick=async()=>{const bx=b.closest('.box'),q=+bx.dataset.q,m=bx.querySelector('.msg'),bl=[...bx.querySelectorAll('.blank')];let a;
    if(bl.length){if(bl.some(x=>!x.value.trim())){m.className='msg no';m.textContent='빈칸을 모두 채워 주세요.';return}a=bl.map((x,k)=>`${k+1}: ${x.value.trim()}`).join('\n')}
    else a=bx.querySelector('input[type=radio]:checked')?.value??bx.querySelector('.ans')?.value??bx.querySelector('.free')?.value??'';
    if(!String(a).trim())return;
    b.disabled=true;m.className='msg wait';m.textContent='저장 중...';const x=await api('submit',{no,act,q,answer:a});b.disabled=false;
    if(x.error){m.className='msg no';m.textContent=x.error;return}rec(no,act,q,a,x.correct);
    if(x.free){m.className='msg ok';m.innerHTML='📨 제출했어요! 고쳐서 다시 제출해도 돼요. '+esc(x.explain||'');return}
    m.className='msg '+(x.correct?'ok':'no');m.innerHTML=(x.correct?'✅ 정답이에요! ':'❌ 아쉬워요, 다시 생각해 봐요. ')+esc(x.explain||'')})}
  if(act==='작성'){box.innerHTML=`<p style="color:var(--sub)">파이썬은 처음 실행할 때 준비하는 데 10~30초 걸려요.</p>`+r.items.map((i,n)=>{const s=r.saved[i.q];return `<div class="box" data-q="${i.q}"><h3>문제 ${n+1}</h3>${fmt(i.text)}
  <textarea spellcheck="false">${esc(s?s.answer:i.start||'')}</textarea><div class="row"><button class="ghost run">▶ 실행</button><button class="main sub">제출하고 채점</button></div>
  <pre class="out" style="display:none"></pre><div class="msg ${s&&s.ok?'ok':''}">${s&&s.ok?'✅ 이전에 통과했어요':''}</div></div>`}).join('');
    box.querySelectorAll('.box').forEach((bx,n)=>{const it=r.items[n],ta=bx.querySelector('textarea'),out=bx.querySelector('.out'),m=bx.querySelector('.msg');
      ta.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'    ')}};
      bx.querySelector('.run').onclick=async()=>{out.style.display='block';out.textContent='실행 중...';try{out.textContent=await runPy(ta.value,it.ins[0])||'(출력 없음)'}catch(e){out.textContent='파이썬을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'}};
      bx.querySelector('.sub').onclick=async()=>{m.className='msg';out.style.display='block';out.textContent='채점 중...';let pass=0,fail=[];
        try{for(let k=0;k<it.outs.length;k++){const o=(await runPy(ta.value,it.ins[k]||'')).replace(/\s+$/gm,'').trim();if(o===String(it.outs[k]).replace(/\s+$/gm,'').trim())pass++;else fail.push(k+1)}}
        catch(e){out.textContent='파이썬을 불러오지 못했어요.';return}
        const ok=pass===it.outs.length;out.textContent=`테스트 ${pass} / ${it.outs.length} 통과`+(fail.length?` (실패: ${fail.join(', ')}번)`:'');
        const x=await api('submit',{no,act,q:it.q,answer:ta.value,ok});if(!x.error)rec(no,act,it.q,ta.value,ok);m.className='msg '+(ok?'ok':'no');m.textContent=ok?'✅ 모두 통과! 제출됐어요.':'❌ 제출은 저장됐어요. 코드를 고쳐서 다시 도전해 봐요.'}})}}
async function lessonView0(){const r=await api('menu');if(!r.error)S.menu=r}

/* 파이썬 실행 (브라우저 안, Pyodide) */
let PYP;function loadPy(){return PYP||(PYP=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';s.onload=()=>loadPyodide().then(ok,no);s.onerror=no;document.head.appendChild(s)}))}
async function runPy(code,inp){const p=await loadPy();p.globals.set('UC',code);p.globals.set('UI',inp||'');
  return p.runPython(`import sys,io
_o=io.StringIO();sys.stdin=io.StringIO(UI);sys.stdout=_o
try:
    exec(UC,{'__name__':'__main__'})
except BaseException as e:
    print(type(e).__name__+': '+str(e))
sys.stdout=sys.__stdout__
_o.getvalue()`)}

/* 관리자 */
async function adminView(force){if(force||!mem.subjects)app.innerHTML='불러오는 중...';
  const sr=await get('subjects',()=>api('subjects'),force);if(sr.error)return app.innerHTML=sr.error;
  if(!sr.subjects.some(s=>s.name===S.asub))S.asub=(sr.subjects.find(s=>s.ready)||sr.subjects[0]||{}).name||'';
  const key='classes|'+S.asub,r=await get(key,()=>api('classes',{sub:S.asub}),force);if(r.error)return app.innerHTML=r.error;
  app.innerHTML=`<div class="row" style="justify-content:space-between"><h2>학급 현황</h2><button class="ghost" onclick="adminView(true)">⟳ 새로고침</button></div><div class="row" style="margin-bottom:14px">${sr.subjects.map(s=>`<button class="chip ${s.name===S.asub?'on':''}" data-sub="${esc(s.name)}">${ico(s.icon)} ${esc(s.name)}${s.ready?'':' (준비중)'}</button>`).join('')}</div>
  <div class="grid">${r.classes.map(c=>`<button class="card" data-c="${c.cls}"><b>${c.cls}반</b><small>${c.count}명 · 전체 진도 ${c.pct}%</small>${bar(c.pct,100)}</button>`).join('')}</div>`;
  app.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{S.asub=b.dataset.sub;adminView()});
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>classView(+b.dataset.c))}
function csvSave(L,name){const q=v=>`"${String(v).replace(/"/g,'""')}"`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.map(x=>x.map(q).join(',')).join('\r\n')],{type:'text/csv'}));a.download=name;a.click()}
async function classView(cls,force){const key='ct|'+S.asub+'|'+cls,sk=S.asub+'|'+cls;if(force||!mem[key])app.innerHTML='불러오는 중...';const r=await get(key,()=>api('classTable',{cls,sub:S.asub}),force);if(r.error)return app.innerHTML=r.error;
  const cols=[];r.lessons.forEach(l=>Object.keys(AN).forEach(k=>l.t[k]>0&&cols.push({l,k,t:l.t[k]})));
  const sel=S.sel[sk]??(r.lessons.length?r.lessons[r.lessons.length-1].no:'all'),vis=sel==='all'?cols:cols.filter(c=>c.l.no===sel);
  const cell=(s,c)=>{const d=Math.min(s.d[c.l.no+'|'+c.k]||0,c.t);return{d,full:d>=c.t,txt:c.k==='개념'?(d?'완료':''):`${d}/${c.t}`}};
  const head1=r.lessons.filter(l=>vis.some(c=>c.l===l)).map(l=>`<th colspan="${vis.filter(c=>c.l===l).length}">[${l.no}차시] ${esc(l.title)}</th>`).join('');
  const body=r.students.map(s=>`<tr><td class="l" data-id="${s.id}">${s.id} ${esc(s.name)}</td>${vis.map(c=>{const x=cell(s,c);return `<td class="${x.full?'done':''}">${x.txt}</td>`}).join('')}</tr>`).join('');
  const foot=vis.map(c=>`<td>${r.students.filter(s=>cell(s,c).full).length}/${r.students.length}</td>`).join('');
  const chips=`<button class="chip ${sel==='all'?'on':''}" data-s="all">전체</button>`+r.lessons.map(l=>`<button class="chip ${sel===l.no?'on':''}" data-s="${l.no}">${l.no}차시</button>`).join('');
  app.innerHTML=`<p><button class="ghost" onclick="adminView()">← 학급 목록</button></p><h2>${esc(S.asub)} · ${cls}반 진도 현황</h2><div class="row" style="margin-bottom:10px">${chips}</div>
  <div class="row" style="margin-bottom:12px"><button class="main" id="csv1">이 화면 CSV</button><button class="ghost" id="csv2">전체 차시 CSV</button><button class="ghost" id="rf">⟳ 새로고침</button><span style="color:var(--sub)">학생 이름을 누르면 답안을 볼 수 있어요.</span></div>
  <div class="wrap"><table><thead><tr><th rowspan="2">학번 이름</th>${head1}</tr><tr>${vis.map(c=>`<th class="a">${AN[c.k][1]}</th>`).join('')}</tr></thead><tbody>${body}</tbody><tfoot><tr><td>완료 학생 수</td>${foot}</tr></tfoot></table></div>`;
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.sel[sk]=b.dataset.s==='all'?'all':+b.dataset.s;classView(cls)});
  app.querySelectorAll('[data-id]').forEach(t=>t.onclick=()=>detailView(t.dataset.id,cls));
  $('#rf').onclick=()=>classView(cls,true);
  const dl=(cs,n)=>csvSave([['학번 이름',...cs.map(c=>`[${c.l.no}차시] ${c.l.title}`)],['',...cs.map(c=>AN[c.k][1])],...r.students.map(s=>[s.id+' '+s.name,...cs.map(c=>cell(s,c).txt)])],n);
  $('#csv1').onclick=()=>dl(vis,`${S.asub}_${cls}반_${sel==='all'?'전체':sel+'차시'}.csv`);$('#csv2').onclick=()=>dl(cols,`${S.asub}_${cls}반_전체차시.csv`)}
async function detailView(id,cls){app.innerHTML='불러오는 중...';const r=await api('detail',{id});if(r.error)return app.innerHTML=r.error;
  const g={};r.recs.forEach(x=>{const k=x.sub+'|'+x.no;(g[k]=g[k]||{sub:x.sub,no:x.no,list:[]}).list.push(x)});const ks=Object.values(g).sort((a,b)=>(b.sub===S.asub)-(a.sub===S.asub)||b.no-a.no);
  app.innerHTML=`<p><button class="ghost" id="b">← ${cls}반 현황</button></p><h2>${esc(id)} ${esc(r.name)}</h2><div class="row" style="margin-bottom:14px"><button id="rs">비밀번호 초기화 (학번으로)</button></div>`+(ks.map((k,i)=>`<details class="box" ${i===0?'open':''}><summary><b>${esc(k.sub)} · ${k.no}차시</b> · 기록 ${k.list.length}건</summary><div class="wrap"><table><thead><tr><th>활동</th><th>문항</th><th>정답</th><th>시도</th><th>최근 제출</th><th>답안</th></tr></thead><tbody>${k.list.map(x=>`<tr><td>${AN[x.act]?AN[x.act][1]:x.act}</td><td>${x.q||'-'}</td><td>${x.free?'✍️ 제출':(x.ok?'⭕':'❌')}</td><td>${x.tries}</td><td>${x.last}</td><td style="text-align:left"><details><summary>보기</summary><pre>${esc(x.answer)}</pre></details></td></tr>`).join('')}</tbody></table></div></details>`).join('')||'<p>아직 기록이 없어요.</p>');
  $('#b').onclick=()=>classView(cls);
  $('#rs').onclick=async()=>{if(!confirm(`${r.name} 학생의 비밀번호를 학번으로 되돌릴까요?`))return;const x=await api('resetPw',{id});alert(x.error||'초기화했어요. 다음 로그인 때 비밀번호를 새로 만들게 됩니다.')}}

/* 시작 */
(async()=>{if(S.token){const u=await api('me');if(!u.error){S.user=u;return start()}}loginView()})();
</script></body></html>
